# Generates this repo's release notes on a release tag. The workflow itself is the org-wide reusable —
# this file supplies only the triggers, so "identical across every repo" becomes structural instead of
# a copy each repo has to keep in step by hand.
#
# It is a TOP-LEVEL workflow rather than a job inside release-oci, and that is load-bearing. A called
# workflow's permissions are capped at its caller's, and the release-oci shims pin `contents: read`,
# so a nested job could never write a release body or a CHANGELOG. Custom secrets are not inherited
# down a nested call either, so ANTHROPIC_API_KEY would not arrive. Triggering at the top level gives
# both natively — which is why this needs no PAT.
#
# Notes never fail a release: every sink in the reusable is independently guarded, and a missing or
# expired credential skips the job with a warning rather than a red tick.
name: release-notes

on:
  push:
    tags: ["[0-9]+.[0-9]+.[0-9]+"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to describe. Default: the ref that triggered this run."
        required: false

jobs:
  release-notes:
    # `@main` IS A BRANCH REF, AND THAT IS A DELIBERATE ORG DECISION, not an
    # oversight. Confirmed by Diego 2026-11-07 as the intended contract for
    # org-owned reusable workflows: floating on a branch is how one shared CI
    # fix reaches every repo in the org without a pull request in each of them.
    # Recorded here so the next reader finds the answer instead of re-opening
    # the question -- the installer session and this one both raised it the same
    # afternoon.
    #
    # WHAT THIS REPO HANDS OVER ON A RELEASE TAG, stated in one place because
    # deriving it means reading two `permissions:` keys, a `secrets:` block and
    # the reusable's own definition in another repository:
    #
    #   contents: write        create/edit/delete releases here, push tags and
    #                          branches. A pushed TAG matters more than it looks:
    #                          release-tag.yaml triggers on tags, so a tag
    #                          publishes a chart to GHCR under this repo's name.
    #   id-token: write        mint an OIDC token asserting
    #                          repo:krateo-blueprints/openstack-nova-operator-kog
    #   CLAUDE_CODE_OAUTH_TOKEN  Anthropic API access billed to the org
    #   SLACK_RELEASE_WEBHOOK    post arbitrary messages to a Slack channel
    #   RELEASE_FEED_TOKEN       cross-repo, never cross-org, per the reusable's
    #                            own header
    #
    # THE CONTRAST WORTH KEEPING. The org chart publisher is pinned to a full
    # commit SHA, not a tag, because it takes an org-wide write-scoped secret
    # from 29 different callers -- a credential crossing a trust boundary, where
    # whoever moves the ref runs code in 29 repos at once. These org workflows
    # are org-owned code the org already controls. Different exposure, different
    # answer; the two decisions only look opposed.
    #
    # AND `.github/dependabot.yml` DOES NOT COVER THIS ONE. github-actions
    # dependabot proposes updates for a tag or a SHA and nothing for a branch,
    # because a branch is already "latest" and moves with no PR at all. The
    # dependabot config exists for the SHA-pinned publisher and the actions/*
    # pins; it is not protection for this line.
    #
    # NOTED WHILE READING THIS: RELEASE_FEED_TOKEN was measured returning 401
    # on 2026-11-07 (openstack-as-a-service, ironic KOG run 42353202553). The
    # reusable guards every sink independently so an expired credential skips
    # with a warning rather than failing the release -- which is why nothing
    # here has ever gone red over it. Worth knowing before trusting that the
    # release feed is actually being written.
    uses: krateo-platformops/.github/.github/workflows/release-notes.yaml@main
    permissions:
      contents: write # the release body and the CHANGELOG commit
      id-token: write # claude-code-action's GitHub App auth; the reusable cannot grant itself this
    # EXPLICIT, NOT `inherit`. `secrets: inherit` carries nothing across an ORGANISATION
    # boundary, and this reusable lives in krateo-platformops while this repo does not. The
    # symptom was silent: HAVE_CRED evaluated false, the job skipped every step and still
    # reported success, so three orgs looked identical and only one was working. Named
    # passing reads this org's own secrets, which is what crosses.
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      RELEASE_FEED_TOKEN: ${{ secrets.RELEASE_FEED_TOKEN }}
      SLACK_RELEASE_WEBHOOK: ${{ secrets.SLACK_RELEASE_WEBHOOK }}
    with:
      tag: ${{ github.event.inputs.tag || '' }}
