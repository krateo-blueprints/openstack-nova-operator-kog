name: apikey-secret-read-arm

# Run hack/probe-apikey-rbac.sh at a CHOSEN oasgen version in CI, and compare a
# subject version against a known-broken control in one run.
#
# THIS IS NOT A NEW MEASUREMENT. hack/probe-apikey-rbac.sh is the careful probe:
# it plants its own fixture, refuses to conclude until oasgen has SAID it granted
# something (splitting "the grant path did not run" from "the grant is
# insufficient -- the 0.54.0 class"), and only trusts a `can-i` denial once
# `can-i` has been shown to say both yes and no. Its cluster run previously
# happened only through hack/gke-run.sh. What was missing, and all this adds:
#
#   1. it is dispatchable in CI at any version, on a fresh kind cluster, and
#   2. nothing compared two versions in one run.
#
# Everything we knew about the apiKey grant before this was from READING FILES
# (hack/measure-apikey-grant.py). All six of this chart's documents are apiKey;
# 0.53.0/0.54.0's hand-written auth-secret path list missed apiKey's tokenRef
# while #473/#475 removed the cluster-wide secrets grant.
#
# THE PROBE'S EXIT VOCABULARY, which this keys off rather than inventing:
#   0  clean: every controller can read the Secret it was granted
#   1  a finding. TWO different messages share it, and they are different defects:
#        "CANNOT read Secret/..."             -> the grant is insufficient: the
#                                                0.54.0 class (apiKey reason)
#        "oasgen never recorded ..."          -> the grant path did not run
#        "did not return to Ready"            -> reconvergence timed out
#   9  VOID: a precondition or control failed, nothing was measured
#   2  usage
#
# WHY THE CONTROL NEEDS A BEARER DOCUMENT. At 0.54.0 the hand-written path list
# has no apiKey entry, so the CORRECT behaviour of that broken list on an
# apiKey-only cluster is to record nothing. "oasgen never recorded a grant" then
# cannot distinguish "the grant path did not run" (setup broken) from "the grant
# path ran and found no apiKey paths" (the 0.54.0 class): same string, same empty
# digest. So at the CONTROL version only, hack/plant-bearer-control.sh stands up a
# synthetic BEARER document in its OWN namespace (bearer-ctl) AFTER the probe. At
# 0.54.0 bearer's tokenRef IS in the list, so a recorded bearer grant proves the
# path ran, and apiKey's silence becomes a finding. At the subject version the
# probe passing is the result and no bearer document is stood up.
#
# THE VERDICT:
#   subject rc 0                                          -> PASS
#   subject rc 1                                          -> FAIL (the message says which)
#   control: bearer grant NOT recorded / not stood up     -> VOID: setup failure,
#       and now that VOID means something (the grant path did not run)
#   control: bearer recorded AND probe rc 1 ("CANNOT read Secret" OR "never
#       recorded")                                        -> CONTROL HELD: the path
#       ran and apiKey specifically was missed
#   control: bearer recorded AND probe rc 0               -> CONTROL PASSED: the
#       INSTRUMENT is in question; every green from it is worthless
#   anything else                                         -> VOID
#
# KNOWN LIMITATION OF THE EXISTING PROBE, DISCOVERED HERE AND NOT CHANGED:
# hack/probe-apikey-rbac.sh's mixed-corpus guard says "Every document here must
# BE apiKey" but reads `status.hasSecuritySchemes`, a boolean equally true for
# bearer and basic. A non-apiKey document in the SAME namespace passes it
# silently and corrupts the corpus. That is a second, independent reason the
# bearer document lives in a different namespace (the probe's enumeration is
# `-n "$NS"`-scoped). Unverified: that the provider reconciles a RestDefinition
# outside its own namespace -- if it does not, the control is VOID, which says so.
#
# CREDENTIAL-FREE: nova.invalid is unroutable, the Secret is a placeholder. Runs
# on a runner, never the shared laptop.

on:
  workflow_dispatch:
    inputs:
      oasgen:
        description: "oasgen-provider version under test (the subject). Required: no default hides a choice."
        required: true
      negative_control:
        description: "A version KNOWN to be unable to read an apiKey Secret."
        required: false
        default: "0.54.0"

env:
  NS: krateo-system

permissions:
  contents: read

jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      SUBJECT: ${{ inputs.oasgen }}
      CONTROL: ${{ inputs.negative_control }}
    steps:
      - uses: actions/checkout@v7
      - uses: azure/setup-helm@v5
      - uses: helm/kind-action@v1
        with:
          # kind only: each version gets its OWN fresh cluster below, so the
          # control's state cannot leak into the subject's reading.
          install_only: true

      - name: The probe's classifier and control gating, before any cluster
        run: bash hack/probe-apikey-rbac.sh --self-test

      - name: The bearer control's fragment and classifier, before any cluster
        run: bash hack/plant-bearer-control.sh --self-test

      - name: The two versions must differ, or the control controls nothing
        run: |
          set -uo pipefail
          if [ -z "$SUBJECT" ] || [ "$SUBJECT" = "$CONTROL" ]; then
            echo "::error::VOID -- subject '$SUBJECT' and control '$CONTROL' must both be set and different."
            exit 3
          fi

      - name: Measure the control, then the subject, each on a fresh cluster
        run: |
          set -uo pipefail
          measure() { # <role> <version> -> sets M_RC and M_LABEL
            local role="$1" v="$2" cl="apikey-read-$1" out="/tmp/probe-$1.log"
            M_LABEL=""; M_RC=3; B_RC=-1
            if ! kind create cluster --name "$cl" --image kindest/node:v1.36.1 --wait 120s; then
              M_LABEL="VOID (no cluster)"; return
            fi
            if ! { helm --kube-context "kind-$cl" upgrade --install oasgen-provider-crds \
                    oci://ghcr.io/krateo-platformops/charts/oasgen-provider-crds \
                    --version "$v" -n "$NS" --create-namespace --wait \
                && helm --kube-context "kind-$cl" upgrade --install oasgen-provider \
                    oci://ghcr.io/krateo-platformops/charts/oasgen-provider \
                    --version "$v" -n "$NS" --wait --timeout 10m; }; then
              M_LABEL="VOID (oasgen $v did not install)"; kind delete cluster --name "$cl" || true; return
            fi
            mkdir -p /tmp/stage; rm -rf "/tmp/stage/$role"; cp -R ./chart "/tmp/stage/$role"
            sed "s/CHART_VERSION/0.0.0-ci/g" ./chart/Chart.yaml > "/tmp/stage/$role/Chart.yaml"
            if grep -q CHART_VERSION "/tmp/stage/$role/Chart.yaml"; then
              M_LABEL="VOID (the chart version stamp failed)"; kind delete cluster --name "$cl" || true; return
            fi
            if ! helm --kube-context "kind-$cl" upgrade --install nova "/tmp/stage/$role" -n "$NS" \
                  --set nova.url=https://nova.invalid/v2.1/p --wait --timeout 5m; then
              M_LABEL="VOID (the chart failed to render/install at oasgen $v)"; kind delete cluster --name "$cl" || true; return
            fi
            # Output goes to a FILE and rc is read immediately: never `$?` after a pipe.
            bash hack/probe-apikey-rbac.sh "$HOME/.kube/config" "kind-$cl" "$NS" > "$out" 2>&1
            M_RC=$?
            cat "$out"
            if [ "$role" = control ]; then
              # AFTER the probe, in its own namespace: see the header.
              bash hack/plant-bearer-control.sh "$HOME/.kube/config" "kind-$cl"
              B_RC=$?
            fi
            if [ "$M_RC" = 0 ]; then M_LABEL="clean"
            elif [ "$M_RC" = 1 ] && grep -q "CANNOT read Secret" "$out"; then M_LABEL="found:apikey-reason"
            elif [ "$M_RC" = 1 ] && grep -q "never recorded" "$out"; then M_LABEL="found:grant-path-did-not-run"
            elif [ "$M_RC" = 1 ]; then M_LABEL="found:other"
            elif [ "$M_RC" = 9 ]; then M_LABEL="void"
            else M_LABEL="unexpected-rc-$M_RC"; fi
            # Free this cluster's CPU before the next one starts.
            kind delete cluster --name "$cl" || true
          }

          measure control "$CONTROL"; C_RC=$M_RC; C_LABEL=$M_LABEL; C_B=$B_RC
          measure subject "$SUBJECT"; S_RC=$M_RC; S_LABEL=$M_LABEL
          echo "control $CONTROL: rc=$C_RC ($C_LABEL)"
          echo "subject $SUBJECT: rc=$S_RC ($S_LABEL)"

          # THE CONTROL GATES FIRST. The bearer witness is read before anything
          # about apiKey, because it decides whether apiKey's silence means anything.
          if [ "$C_B" != 0 ]; then
            echo "::error::VOID -- at the control ($CONTROL) the BEARER positive control did not record a grant (rc=$C_B; 1 = stood up but no grant, 3 = could not stand up, -1 = never reached). The grant path did not demonstrably RUN, so an apiKey result here is not attributable. This is a setup failure, not a finding about apiKey. The subject was not judged."
            exit 3
          fi
          if [ "$C_RC" = 0 ]; then
            echo "::error::CONTROL PASSED -- $CONTROL, known unable to read an apiKey Secret, read as CLEAN while a bearer grant was recorded. The INSTRUMENT, not the provider, is now in question: this arm cannot tell a broken grant from a working one, and every green from it is worthless. The subject's result ($S_LABEL) must not be read."
            exit 3
          fi
          if [ "$C_LABEL" != "found:apikey-reason" ] && [ "$C_LABEL" != "found:grant-path-did-not-run" ]; then
            echo "::error::VOID -- the control ($CONTROL) failed in a way that is neither 'CANNOT read Secret' nor 'never recorded' (got: $C_LABEL, rc=$C_RC). The subject was not judged."
            exit 3
          fi
          echo "::notice::CONTROL HELD: at $CONTROL the bearer grant was recorded (the path ran) and apiKey was missed ($C_LABEL)"
          case "$S_LABEL" in
            clean) echo "::notice::PASS WITH THE CONTROL HELD -- oasgen $SUBJECT: every generated controller can read the apiKey Secret it was granted. One version on one cluster says nothing about any other version."; exit 0 ;;
            found:*) echo "::error::oasgen $SUBJECT FAILS ($S_LABEL) with the control held. Read the probe output above: 'CANNOT read Secret' is the 0.54.0 class, 'never recorded' is the grant path not running. Do not pin it."; exit 1 ;;
            *) echo "::error::VOID -- the subject could not be measured ($S_LABEL, rc=$S_RC). That is NOT a pass."; exit 3 ;;
          esac
