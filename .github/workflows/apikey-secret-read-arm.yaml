name: apikey-secret-read-arm

# Does a generated controller actually READ an apiKey Secret? Watched, not read.
#
# WHY THIS ARM EXISTS. All six of this chart's documents use an apiKey security
# scheme whose `tokenRef` points at a Secret. oasgen-provider 0.53.0 and 0.54.0
# shipped a hand-written list of auth-secret paths that covered basic's two refs
# and bearer's one and MISSED apiKey's, while #473/#475 removed the cluster-wide
# secrets grant on the grounds that the narrow Role "already covered the same
# ground" -- true for basic and bearer, never for apiKey. Reported upstream: 25
# apiKey kinds unable to read a credential in any namespace.
#
# EVERYTHING WE KNEW ABOUT THAT GRANT WAS FROM READING FILES (hack/measure-
# apikey-grant.py, run by apikey-safe-set.yaml). Nobody here had watched a
# generated controller read an apiKey Secret. This does, on a real cluster, at
# one version at a time, with the version known to be broken as the control.
#
# TWO WITNESSES, because one is not enough (hack/measure-apikey-secret-read.py):
#   A, the mechanism: the generated Role `<resource>-<group>-<ver>-authsecrets`
#      exists and its resourceNames contain the Secret.
#   B, the behaviour: a safe version gets PAST the secret read and fails on the
#      network (the endpoint is the unroutable nova.invalid); 0.54.0 fails ON
#      the read with a Forbidden. Positive evidence of the dial failure is
#      required -- the mere absence of a Forbidden is never read as a pass.
#
# PREDICTION, which the first dispatch confirms or refutes: at 0.54.0 the
# hand-written auth-secret path list has no apiKey entry, so the control's Role
# should be genuinely absent or carry no secret, and B should be a Forbidden. A
# control with NO authsecrets Role for ANY resource is a setup failure (VOID),
# not evidence, so it cannot hold vacuously.
#
# A NEGATIVE CONTROL THAT PASSES IS THE MOST IMPORTANT THING THIS CAN CATCH. If
# 0.54.0 reads as working, the instrument -- not the provider -- is in question.
#
# CREDENTIAL-FREE, no vendor needed. Runs on a runner, never the shared laptop.

on:
  workflow_dispatch:
    inputs:
      oasgen:
        description: "oasgen-provider version under test (the subject). Required: there is no default that hides a choice."
        required: true
      negative_control:
        description: "A version KNOWN to be unable to read an apiKey Secret."
        required: false
        default: "0.54.0"

env:
  NS: krateo-system

permissions:
  contents: read

jobs:
  measure:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      SUBJECT: ${{ inputs.oasgen }}
      CONTROL: ${{ inputs.negative_control }}
    steps:
      - uses: actions/checkout@v7
      - uses: azure/setup-helm@v5
      - uses: helm/kind-action@v1
        with:
          # kind is installed, no cluster is created: each version gets its OWN
          # fresh cluster from the probe, so the control's state cannot leak
          # into the subject's reading.
          install_only: true

      - name: The classifier, before any cluster is spent
        # Every branch in both directions, including that `neither` is reachable
        # and that an absent Role reads ABSENT rather than as a missing Secret.
        run: python3 hack/measure-apikey-secret-read.py --self-test

      - name: The two versions must differ, or the control controls nothing
        run: |
          set -uo pipefail
          if [ -z "$SUBJECT" ] || [ "$SUBJECT" = "$CONTROL" ]; then
            echo "::error::VOID -- subject '$SUBJECT' and control '$CONTROL' must both be set and different; a control compared with itself proves nothing."
            exit 3
          fi

      - name: Gather the control (known broken)
        id: gather_control
        run: |
          set -uo pipefail
          bash hack/probe-apikey-secret-read.sh control "$CONTROL" /tmp/arm-control
        continue-on-error: true

      - name: Free the control's cluster before the subject's
        if: always()
        run: kind delete cluster --name apikey-read-control || true

      - name: Gather the subject
        id: gather_subject
        run: |
          set -uo pipefail
          bash hack/probe-apikey-secret-read.sh subject "$SUBJECT" /tmp/arm-subject
        continue-on-error: true

      - name: Verdict
        run: |
          set -uo pipefail
          # A gather step that failed produced no usable files; the classifier
          # reads a missing file as UNREAD, which is VOID -- never a verdict.
          for r in control subject; do
            w=/tmp/arm-$r
            v=$SUBJECT; [ "$r" = control ] && v=$CONTROL
            rc=0
            python3 hack/measure-apikey-secret-read.py verdict --role "$r" --version "$v" \
              --roles "$w/roles.json" --evidence "$w/evidence.txt" \
              --plural "$(cat "$w/plural" 2>/dev/null || echo unknown)" \
              --secret "$(cat "$w/secret" 2>/dev/null || echo unknown)" \
              --host "$(cat "$w/host" 2>/dev/null || echo nova.invalid)" \
              --out "/tmp/result-$r.json" || rc=$?
            echo "$r rc=$rc"
          done
          rc=0
          python3 hack/measure-apikey-secret-read.py combine /tmp/result-subject.json /tmp/result-control.json || rc=$?
          case "$rc" in
            0) echo "::notice::PASS WITH THE CONTROL HELD -- oasgen $SUBJECT's generated controller read the apiKey Secret (Role grants it, and the controller got past the read to the network) while $CONTROL could not. One version on one cluster: this says nothing about any other version." ;;
            1) echo "::error::oasgen $SUBJECT GENUINELY FAILS THE SECRET READ -- no Role grants the apiKey Secret and the controller was Forbidden reading it, with the control held. This is the 0.54.0 class: do not pin it." ;;
            3) echo "::error::VOID -- a witness could not be obtained, the witnesses disagreed, or the CONTROL PASSED. If the control passed, the INSTRUMENT is in question (it cannot tell a broken grant from a working one) and no green from it means anything. Read the per-version verdicts above." ;;
            *) echo "::error::unexpected exit $rc" ;;
          esac
          exit "$rc"

      - name: What the cluster held, whatever the verdict
        if: always()
        run: |
          for r in control subject; do
            echo "=== $r: evidence tail ==="; tail -60 "/tmp/arm-$r/evidence.txt" 2>&1 || true
          done
