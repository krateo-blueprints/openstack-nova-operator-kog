name: repository-standard

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  repository-standard:
    # PINNED TO A FULL SHA, and the comment names the version it is: charts
    # 1.10.0. Verified rather than copied from the message that proposed it --
    # `refs/tags/1.10.0` is an annotated tag object d360f741c491... that
    # DEREFERENCES to 3c619b87b694..., which is the SHA below. A tag ref and the
    # commit it points at are different objects, and pinning the tag object would
    # pin nothing a runner can check out. (1.6.0 and 1.8.0 were verified the same
    # way and pinned here in turn; this upstream moves several times a day, so
    # treat any version in this file as stale and re-derive it.)
    #
    # WHAT WAS MEASURED BEFORE MOVING THE PIN, because a bump's real risk is a
    # DIFFERENT rule tightening while you are reading the one you came for:
    # `fail()` counts per rule are IDENTICAL at 1.8.0 and 1.10.0 --
    # R1=2 R2=2 R3=3 R4=1 R5=0 R6=2 R7=1 R8=1 -- and the only rule-logic change
    # between them is inside R5, warn() to warn(). So this bump cannot newly fail
    # this repository. Diffing the two checkers is the check; the release note is
    # not.
    #
    # 1.8.0's R3 NOW CHECKS `home` AND `sources`, and we pass: both name
    # https://github.com/krateo-blueprints/openstack-nova-operator-kog. Checked
    # before bumping, with a control -- the same logic pointed at the
    # unhyphenated krateoplatformops org correctly fails. That matters here
    # specifically, because the org rename left 385 live index entries pointing
    # at the unhyphenated name, which resolves 200 through GitHub's redirect and
    # so fails silently; R3 compares STRINGS for exactly that reason.
    #
    # WHY A PIN HERE AND A FLOAT IN security.yml, which is the apparent
    # inconsistency a reader will notice first: `krateo-blueprints/charts` is
    # pinned as a class in this repository (release-tag.yaml pins
    # release-preflight.yaml and publish-chart.yaml at 1.4.3), because that is
    # where an org-wide write-scoped secret crosses a trust boundary. This
    # particular workflow takes no secret -- it reads files, with no network and
    # no token -- so the trust argument does not reach it on its own. It is
    # pinned for consistency with the other two charts pins, so that one
    # repository does not hold two answers for one upstream.
    #
    # R5 IS ADVISORY AT THIS VERSION, AND THAT IS WHY THIS CAN BE WIRED AT ALL.
    # Every R5 branch calls warn(), none calls fail() (0 of them at this SHA,
    # counted), and sys.exit(1) is reached only `if errors` -- so our
    # repository-specific release-tag.yaml is reported as a warning and the job
    # still exits 0. Verified by reading the checker at this SHA, as at 1.6.0 and
    # 1.8.0 before it, rather than inferred from a release note. R5's own comment
    # now states the condition: "Advisory until release-oci 2.1.0, the first
    # version every index channel can adopt."
    #
    # SO THIS WILL GO RED ON ITS OWN ONE DAY, AND THE VERSION THAT MATTERS IS PER
    # CHANNEL -- which is the trap, because the version numbers hide it:
    #
    #     index_channel: none                        -> release-oci 2.0.0 or later
    #     index_channel: blueprints|pages|operators  -> release-oci 2.1.0 or later
    #
    # WE ARE `blueprints`, SO OUR TARGET IS 2.1.0. Do NOT "fix" a red check by
    # migrating to 2.0.0, which is tagged and looks newer than nothing: at
    # 7da11cb (2.0.0) a chart skipped as already-published is EXCLUDED from the
    # `pushed` output (release-oci.yaml:738-745, `ok_of && !skip_of`) while the
    # index jobs are gated on `pushed != '[]'` (:762). So a release that pushed to
    # GHCR and then failed to index could never be finished by re-running it --
    # exactly the 0.1.9 failure our release-tag.yaml `publish_index` input exists
    # for, where both jobs went green and one of them by not running. Read in the
    # file, not inferred. 2.1.0 indexes every chart of the release, pushed or
    # skipped; its content is aa90d48e1a10 and it was UNTAGGED as of 2026-11-23,
    # so there is nothing to pin yet.
    #
    # OUR DECISION (Diego, 2026-11-22, retargeted 2026-11-23): migrate ONCE, at
    # 2.1.0. The flip is deferred to the charts release after release-oci 2.1.0
    # and announced to owners first, so no red mark is expected in the meantime --
    # earlier text in this file said one was imminent, which was true of charts
    # 1.8.0 and stopped being true at 1.10.0.
    #
    # AND "DELETE release-tag.yaml" IS NOT A ONE-FILE CHANGE. Measured here:
    # ELEVEN files reference it, and the ones that matter are gates rather than
    # prose -- three screens in scripts/validate.py hard-code the path (the
    # DRY_RUN-on-every-mutation screen, the stamping-loop assertion screen, and
    # a docs-consistency screen), and hack/validate-shared-preflight.py reads
    # the release-preflight pin OUT OF that file. Deleting the workflow without
    # retiring each of those deliberately would stop them gating while every
    # check stays green -- the same double-duty trap as rule 12, where the
    # retired block turned out to check two things and only one had a
    # replacement. Re-run that inventory at migration time; do not trust this
    # count.
    #
    # AND AT 1.10.0 R5 SAYS THE MIGRATION DELETES MORE THAN THAT WORKFLOW, which
    # makes the change smaller rather than larger: release-oci 2.x runs
    # release-preflight and publish-chart ITSELF, so migrating also deletes our
    # own release-preflight call (rule 12, adopted at charts 1.4.3), our
    # chart-push path (rule 14) and the publish-to-index job. The checker warns
    # when any of those is called BESIDE release-oci. Those warnings cannot fire
    # here yet, because they are guarded by actually calling release-oci and we
    # do not -- today we get only "no workflow calls release-oci" and the
    # release-tag.yaml warning. The trap is for repositories that adopted rules
    # 12 and 14 as instructed: those calls work, they were org-mandated, and
    # R5's older text said to keep them, so following the standard carefully is
    # what sets up the double publish. Release assets and release notes stay
    # TOP-LEVEL caller jobs, because a called workflow is capped at the caller's
    # `contents: read` and cannot write a release.
    #
    # DO NOT ADD THIS TO BRANCH PROTECTION. Nothing here produces a required
    # context today, and making this one required would hand an upstream
    # advisory-to-error flip the power to block every pull request in this
    # repository on a day nobody here changed anything.
    uses: krateo-blueprints/charts/.github/workflows/repository-standard.yaml@3c619b87b694f2b848c356cb0b2390634cfbd1f2 # 1.10.0
