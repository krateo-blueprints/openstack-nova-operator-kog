name: repository-standard

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  repository-standard:
    # PINNED TO A FULL SHA, and the comment names the version it is: charts
    # 1.13.2. Verified rather than copied from the message that proposed it --
    # `refs/tags/1.13.2` is an annotated tag object 3e09cde448f4... that
    # DEREFERENCES to 5825f8963e30..., which is the SHA below. A tag ref and the
    # commit it points at are different objects, and pinning the tag object would
    # pin nothing a runner can check out. (1.6.0, 1.8.0 and 1.10.0 were verified the same
    # way and each in turn became this file's pin; this upstream moves several times a day, so
    # treat any version in this file as stale and re-derive it.)
    #
    # WHAT WAS MEASURED BEFORE MOVING THE PIN, because a bump's real risk is a
    # DIFFERENT rule tightening while you are reading the one you came for:
    # `fail()` counts per rule, 1.10.0 -> 1.13.2, counted by `fail("R<n>"` and
    # `warn("R<n>"` in the two fetched files (non-empty, `R5` present as control):
    #   1.10.0: R1=2 R2=2 R3=3 R4=1 R6=2 R7=1 R8=1, R5 = 4 warn() / 0 fail()
    #   1.13.2: R1=2 R2=2 R3=4 R4=1 R6=2 R7=1 R8=1, R5 = 6 warn() / 0 fail()
    # Only R3 gained a fail(); R5 gained two warn()s. Diffing the two checkers is
    # the check; the release note is not.
    #
    # THE FOURTH R3 FAIL CANNOT REACH THIS REPOSITORY. It is the
    # `krateo.io/source-repo` annotation rule, and its gate is
    #     if d == "chart" and read("chart/compositiondefinition.yaml") is not None:
    # i.e. it applies only when the CompositionDefinition sits INSIDE the chart
    # directory. Ours is at the repository root (./compositiondefinition.yaml);
    # chart/compositiondefinition.yaml does not exist, so the `elif got != want`
    # branch -- the name check 1.10.0 already had -- is the one that runs.
    #
    # 1.8.0's R3 NOW CHECKS `home` AND `sources`, and we pass: both name
    # https://github.com/krateo-blueprints/openstack-nova-operator-kog. Checked
    # before bumping, with a control -- the same logic pointed at the
    # unhyphenated krateoplatformops org correctly fails. That matters here
    # specifically, because the org rename left 385 live index entries pointing
    # at the unhyphenated name, which resolves 200 through GitHub's redirect and
    # so fails silently; R3 compares STRINGS for exactly that reason.
    #
    # WHY A PIN HERE AND A FLOAT IN security.yml, which is the apparent
    # inconsistency a reader will notice first: `krateo-blueprints/charts` is
    # pinned as a class in this repository (release.yaml pins the shared
    # release-oci by SHA, and release-oci pins release-preflight and
    # publish-chart in turn), because that is where an org-wide write-scoped
    # secret crosses a trust boundary. This
    # particular workflow takes no secret -- it reads files, with no network and
    # no token -- so the trust argument does not reach it on its own. It is
    # pinned for consistency with the other two charts pins, so that one
    # repository does not hold two answers for one upstream.
    #
    # R5 IS SATISFIED NOW: THIS REPOSITORY RELEASES THROUGH THE SHARED PATH.
    # release-tag.yaml is gone and .github/workflows/release.yaml calls
    # krateo-platformops/.github release-oci.yaml at 2.1.0, with an explicit
    # index_channel, `packages: write` on the calling job and a dispatch that
    # passes chart_version. What follows is kept because it is the reasoning the
    # migration rests on, and because the deadline below is still ahead.
    #
    # R5 BECOMES A FAILURE IN charts 1.14.0, ON 2026-12-02 (announced in
    # krateo-blueprints/charts#66). AND THAT DATE COULD NEVER HAVE TURNED THIS
    # REPOSITORY RED ON ITS OWN, which is worth writing down because the
    # announcement lists this repository as one of two that would: the pin below
    # is a full SHA at charts 1.10.0, and that checker is hermetic -- it reads
    # files, with no network and no clock. Measured rather than assumed: at
    # 1.10.0 R5 was 4 warn() and 0 fail(), and the only `date` match in the whole
    # file is the word "updates" in a comment. A pinned advisory check does not
    # become a failing check because its upstream released a new version.
    #
    # WHAT THE DEADLINE ACTUALLY COSTS, then: not a red mark on 2 December, but
    # the ability to ever move this pin again. Staying unmigrated would have
    # frozen it at 1.10.0 permanently -- and a pin that can never move is a
    # security argument lost, since the whole reason it is a SHA is that someone
    # reviews the bump. That is the real reason to migrate on schedule rather
    # than when something goes red.
    #
    # charts 1.14.0 IS PLANNED FOR 2026-12-02 AND CARRIES ONLY R5's warn() ->
    # fail() FLIP (1.13.2 is still 6 warn()/0 fail() for R5). This repository
    # already satisfies R5 because it releases through release-oci, so that
    # release should not change this repository's result.
    #
    # WHY 2.1.0 AND NOT 2.0.0: at 7da11cb (2.0.0) a chart skipped as
    # already-published is EXCLUDED from the `pushed` output
    # (release-oci.yaml:738-745, `ok_of && !skip_of`) while the index jobs are
    # gated on `pushed != '[]'` (:762). So a release that pushed to GHCR and then
    # failed to index could never be finished by re-running it -- exactly the
    # 0.1.9 failure release-tag.yaml's `publish_index` input existed for, where
    # both jobs went green and one of them by not running. 2.1.0 indexes every
    # chart of the release, pushed or skipped. Read in the file, not inferred.
    #
    # AND NOT 2.2.0, WHICH IS NEWER BY 34 SECONDS: for an indexed channel the two
    # differ only in an `allow-prerelease` input that evaluates false here -- but
    # 2.2.0 also moves release-oci's three internal charts pins from 1.9.3 to
    # 1.11.0, and those three (release-preflight, the index-gate action,
    # publish-chart) are what gates and performs the push. 2.1.0 is the version
    # with a measured end-to-end index-path release behind it
    # (krateo-arubacloud-provider-kog 0.5.0, 2026-11-25).
    #
    # "DELETE release-tag.yaml" WAS NOT A ONE-FILE CHANGE, and the inventory was
    # re-run at migration time rather than trusted: FOURTEEN files referenced it,
    # not the eleven counted before. The gates among them were retired on purpose:
    #   - scripts/validate.py's DRY_RUN screen was RETARGETED at release.yaml, and
    #     its VERBS list lost `"${CHART_PUSH}"` deliberately -- the registry push
    #     now happens in release-oci's runner, gated by its dry_run, so a verb
    #     looking for it here would make the screen VOID on every run. It still
    #     gates the one mutation this repository performs itself, the release
    #     asset, whose verbs are live in hack/publish-release-assets.sh.
    #   - hack/validate-shared-preflight.py was REWRITTEN as a TWO-HOP check
    #     (ours -> release-oci at that commit -> the release-preflight pin IT
    #     carries) rather than retired as "upstream's job now", which would have
    #     left two pins between this repository and the gate with nothing
    #     measuring the far one.
    #   - the stamping screen needed no change but its prose did: nothing here
    #     stamps twice any more. Re-measured, not assumed: 16 stamping files, none
    #     with two substitutions, none without an assertion.
    # The rule-12 release-preflight call, the rule-14 chart-push path and the
    # publish-to-index job all went with the workflow, because release-oci runs
    # each itself and calling them beside it publishes twice. Release assets and
    # release notes stay TOP-LEVEL caller jobs, because a called workflow is
    # capped at the caller's `contents: read` and cannot write a release.
    #
    # DO NOT ADD THIS TO BRANCH PROTECTION. Nothing here produces a required
    # context today, and making this one required would hand an upstream
    # advisory-to-error flip the power to block every pull request in this
    # repository on a day nobody here changed anything.
    uses: krateo-blueprints/charts/.github/workflows/repository-standard.yaml@5825f8963e30193120c0460f6c6f31b596bf1ed8 # 1.13.2
