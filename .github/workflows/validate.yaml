# Repo guards that need no cluster, so they run on every PR.
#
# WHY THIS EXISTS. Three defects were found shipping in this repository on
# 2026-10-29, none of which helm lint, kubeconform or preflight-refs could see:
#
#   1. Every Composition example hardcoded an apiVersion that cannot be correct,
#      because core-provider derives it from the chart version and this chart's
#      version is a release-time placeholder. It failed as `no matches for kind`,
#      which is also what a missing CRD says, so it misdirects the reader.
#   2. All five install docs pointed at charts.krateo.io, which serves
#      oasgen-provider appVersion 0.10.0 -- below apiKey support AND below the
#      0.26.1 fix that stopped credential HEADERS being written to pod logs in
#      cleartext. The sample ships `connector-verbose: "true"`, and verbose is
#      what you switch on to debug the 401 you are getting. A sibling repo
#      measured 90 live bearer tokens in a single controller log from this.
#   3. (Latent here, realised elsewhere.) A generated kind colliding with a
#      Kubernetes built-in makes oasgen >= 0.32.0 refuse the CRD on a FRESH
#      cluster while only warning where it already exists -- invisible until
#      someone installs clean.
#
# OASGEN_VERSION below is the SINGLE source of truth for the pin. The docs are
# checked against it, so bumping the floor is one line here.

name: validate

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

env:
  # The oasgen-provider version this blueprint is documented and tested against.
  # 0.19.0 introduced apiKey/in-header; 0.26.1 is a HARD floor (credential-header
  # redaction); 0.40.0 added the stdlib security work, whose crypto/x509 findings
  # land hardest on rest-dynamic-controller, whose whole job is outbound TLS.
  #
  # 0.41.0 is documented only because it has been EXERCISED, not merely published:
  # a pod starts and reconciles (the distroless/static base swap and the
  # unstructured-runtime v1.6.1 finalizer change are exactly the class that passes
  # every static check and fails on a cluster), and this chart's own apiKey
  # assertion was re-run against it -- generated methods ['apiKey'], fields
  # [header, tokenRef, valuePrefix]. Both 0.40.0 and 0.41.0 pin plumbing v1.14.2
  # and their internal/tools/render/ trees are identical, so the derived resource
  # apiVersion (v2-1) is unchanged. Do not raise this to a tag nobody has run.
  OASGEN_VERSION: "0.52.0"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Needed to read main's pin for the bump-gate step below. The default
          # shallow fetch cannot see origin/main, and a failed read there would
          # make both pins empty -- which compares EQUAL and silently skips the
          # gate, i.e. a negative result indistinguishable from not having run.
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install PyYAML
        run: pip install --quiet pyyaml

      - name: Run repo guards
        run: python3 scripts/validate.py

      # get-token.sh is the script a quickstart reader actually runs, and the
      # one that handles credentials. It had ZERO coverage while every other
      # script in hack/ and scripts/ was referenced by a workflow -- found by a
      # hand audit, which is why validate.py now has a screen that makes the
      # same audit standing.
      #
      # Only its REFUSALS are testable here: the happy path needs a real
      # Keystone. Every case exits before the first network call, so this needs
      # no cluster, no credential and no egress.
      - name: get-token.sh must refuse what it documents refusing
        run: bash scripts/test-get-token.sh

      # smoke.yaml's sample guard applies every chart/samples/*.yaml against a
      # live API server. The smoke job IS that guard's positive arm and runs on
      # every PR -- but its REFUSAL arms never run there, because this repo
      # always has samples and they always apply. So the paths that matter were
      # exercised by nothing.
      #
      # This step calibrates them with no cluster: an empty sample set must be
      # VOID rather than a cheerful pass, and a sample that fails to apply must
      # still fail the guard. It extracts the step from smoke.yaml by a
      # STRUCTURAL parse keyed on its name -- not a copy of the logic, because
      # the first calibration of that guard ran a reconstruction and proved only
      # that the reconstruction worked.
      - name: smoke.yaml's sample guard must refuse an empty sample set
        run: bash scripts/test-smoke-guards.sh

      # smoke.yaml and two probe scripts now gate on wait_for, so a wait_for that
      # silently returned 0 would turn every one of those gates into a pass. The
      # arms that matter are the refusals: never-true must exit 1 and say TIMEOUT,
      # attempts=0 must be rejected rather than returning without evaluating the
      # predicate, and a predicate's stderr must survive. Covering the helper here
      # rather than exempting it, for the same reason the uid watcher is covered.
      - name: the wait_for helper must still be able to time out
        run: bash hack/lib/wait-self-test.sh

      # probe-401.sh decides whether a rejected credential is distinguishable
      # from an unreachable vendor, and its answer is a COMPARISON. A comparator
      # that always said "same" would print CONFIRMED -- the reassuring answer --
      # and a normalisation that stripped too little would print REFUTED, a false
      # finding. Both already happened once: the host patterns did not absorb the
      # port, so :8080 survived and the arms read as different. The probe itself
      # needs a cluster; its comparator does not, so the comparator is covered
      # here and the cluster run is only ever about the two readings.
      - name: the 401-vs-unreachable comparator must be able to say same AND different
        run: bash hack/probe-401.sh --self-test

      - name: The schemaWarnings gate must prove it can report each verdict
        # Six arms over synthetic status documents: clean, a warning present,
        # and the four separate ways of being unable to look. Plus two suite
        # arms -- every verdict must be expected by some arm (or the suite
        # would pass against a classifier returning a constant), and the VOID
        # arms must produce DISTINCT messages (or a VOID would send a reader to
        # the wrong cause). Mutation-tested both ways.
        run: python3 scripts/check-schema-warnings.py --self-test

      - name: The apiKey RBAC probe's verdict must depend on its controls
        # The probe's whole value is that a "denied" is only a finding when
        # can-i has been shown capable of saying both yes and no. These arms
        # assert exactly that: a denial with a broken control VOIDs rather than
        # becoming a finding, and an unreadable can-i is neither answer.
        # Mutation-tested -- neutralising the control gate fails 6 arms.
        run: bash hack/probe-apikey-rbac.sh --self-test

      - name: The #549 classifier must put invalidating conditions FIRST
        # A rotated log must VOID even when the pairs look like a finding, and
        # a restart must VOID even when they look clean -- because a restart
        # re-applies every CRD by design, and a restart plus a real loop
        # produces the same counts as a restart alone. These arms assert the
        # ORDER of the checks, not just their outcomes: moving the pair
        # comparison to the front of the classifier fails 4 arms including the
        # precedence arm.
        run: bash hack/probe-549-reapply.sh --self-test

      - name: probe-401's mock must behave as the probe assumes, as shipped
        # Runs the nginx config EXTRACTED FROM probe-401.sh in plain Docker and
        # asserts the two properties the probe draws conclusions from: it
        # answers every request with the configured status, and its access log
        # records that status with populated fields. The probe's positive
        # control cross-checks curl against that log, so a mock that served
        # correctly but logged blanks would make the control VOID on every run,
        # and one that logged a status it had not served would make it a
        # permanent pass. Neither is visible from the probe's own output.
        #
        # The config is extracted and re-expanded THROUGH THE SHELL, not
        # transformed, because the first version un-escaped with sed and so
        # could not distinguish an escaped nginx variable from one the shell
        # had eaten -- it passed that mutant. Needs Docker, not a cluster.
        run: bash hack/validate-401-mock.sh 401

      - name: The #590 restart classifier must treat a missing env roll as a finding
        # #590 removes the readiness gate on the controller restart, so the
        # intended result is a DISCRIMINATION: an rdc.env change must still roll
        # every controller, a secretRef Secret-set change must not. The
        # maintainer asked for the first half specifically, because an
        # over-correction that stops rolling on an env change is worse than the
        # bug it replaces and is invisible -- a controller quietly running stale
        # configuration looks exactly like one correctly left alone.
        #
        # These arms assert the classifier cannot report that as acceptable
        # under any pairing, and that the benign verdict is still reachable so
        # it is not merely a function that always complains. Mutation-tested
        # both ways.
        run: bash hack/probe-590-restart.sh --self-test

      - name: The groundtruth mock must distinguish a credential from its absence
        # probe-redirect.sh's second mock is the instrument behind this repo's
        # only security-relevant published claim: docs/configuration.md says
        # that below oasgen 0.50.0 a 302 sent the Keystone token to the
        # redirect target, "with the receiving host reporting what it got:
        # x_auth_token=PRESENT". That sentence holds only if the receiving host
        # can say PRESENT *and* ABSENT.
        #
        # Its field comes from `map $http_x_auth_token $authhdr`, so a
        # misspelled variable or a bad context yields ALWAYS-ABSENT -- which
        # reads as "the credential did not leak". Reassurance on a security
        # finding is the worst failure direction available, and nothing had run
        # these bytes outside the probe itself.
        #
        # Four arms, and arm 3 is the one that matters: the two arms must
        # DISAGREE, because an always-ABSENT mock passes the uncredentialed arm.
        # Mutation-tested with the text needles left intact -- flipping the
        # map's default to ABSENT passes extraction and arms 2 and 4, and is
        # caught by arms 1 and 3.
        run: bash hack/validate-redirect-mock.sh

      - name: The disposable-GKE runner must plan without creating anything
        # Diego directed all sessions off local kind clusters and onto
        # disposable GKE after the shared laptop hit load 148. This asserts the
        # runner's DRY RUN creates nothing and needs no credentials -- so the
        # plan, the cluster shape and the delete-and-verify logic are reviewable
        # in CI without spend. `--go` is the only path that costs money and is
        # never exercised here.
        run: bash hack/gke-run.sh

      - name: the pre-bump ACK must still be able to refuse
        # The ack is the ONLY way a changed protected file produces exit 0, so
        # it is a bypass. Its PASS arm runs on every pin change (the step
        # above); its refusal arms run nowhere unless this does. Arm A injects
        # the defect into hack/prebump-gate.py itself rather than a copy of its
        # logic -- proving "a checker can return non-zero" proves nothing about
        # this checker.
        env:
          # WITHOUT THIS THE TEST VOIDS, and it did: unauthenticated `gh api`
          # cannot read the upstream contents endpoint, so every protected path
          # looked ABSENT, the gate exited 3 (VOID) instead of 1 (REFUSE), and
          # the arms expecting a refusal reported a mismatch. The step above
          # has always carried the token; this one was added without it.
          #
          # The gate failing SAFE is the only reason this was a red CI run and
          # not a false green: it refuses to call a path it cannot read
          # "unchanged". A gate that treated an unreadable path as unchanged
          # would have printed "nothing protected changed" and passed.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/test-prebump-ack.sh

      # A bump must not be able to skip the GVK gate. hack/prebump-gate.py was
      # a script a human had to remember to run, which is the same defect it was
      # written to fix: a check nobody invokes is not a check.
      #
      # THE TRAP THIS STEP IS BUILT AROUND. If either pin fails to parse, both
      # values are empty, they compare EQUAL, and the gate is skipped with a
      # cheerful message. That is the exact family of defect this repo keeps
      # finding -- so both pins are asserted to be semver-shaped BEFORE they are
      # compared, and an unparseable pin FAILS rather than skipping.
      - name: A changed oasgen pin must pass the GVK gate
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          read_pin() {  # $1 = a file path or `git show` spec
            grep -oE 'OASGEN_VERSION: "[0-9]+\.[0-9]+\.[0-9]+"' "$1" 2>/dev/null \
              | head -1 | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' || true
          }
          HEAD_PIN=$(read_pin .github/workflows/validate.yaml)
          git show origin/${{ github.base_ref }}:.github/workflows/validate.yaml > /tmp/base-validate.yaml
          BASE_PIN=$(read_pin /tmp/base-validate.yaml)

          # Precondition, before any comparison. An empty pin is not "no change".
          for pair in "head:$HEAD_PIN" "base:$BASE_PIN"; do
            which=${pair%%:*}; val=${pair#*:}
            if [ -z "$val" ]; then
              echo "could not read the $which OASGEN_VERSION pin."
              echo "Both pins empty would compare EQUAL and skip this gate, so"
              echo "this FAILS instead. Check the pin's format in validate.yaml."
              exit 1
            fi
          done
          echo "  base pin: $BASE_PIN"
          echo "  head pin: $HEAD_PIN"

          if [ "$BASE_PIN" = "$HEAD_PIN" ]; then
            echo "  pin unchanged -- the gate has nothing to compare, correctly skipping"
            exit 0
          fi
          echo "  pin CHANGED $BASE_PIN -> $HEAD_PIN; the gate must pass"
          python3 hack/prebump-gate.py "$BASE_PIN" "$HEAD_PIN"
