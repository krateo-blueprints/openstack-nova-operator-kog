# Packages every chart in this repo and publishes each to the GitHub Container Registry as an OCI
# Helm artifact on every semver tag. Shape-agnostic: it discovers charts by locating each Chart.yaml
# (skipping vendored subcharts under charts/), so it works regardless of the repo's directory layout.
#
# Charts opt into versioning with the CHART_VERSION placeholder in Chart.yaml, which the git tag
# replaces at publish time. Pushing tag "0.1.0" publishes each chart <name> as:
#   oci://ghcr.io/<owner>/charts/<name>:0.1.0
name: release-tag

on:
  push:
    tags: ["[0-9]+.[0-9]+.[0-9]+"]
  # DISPATCHABLE SO THE RELEASE PATH IS EXERCISABLE WITHOUT BURNING A VERSION.
  # Until now the only way to run any of this was to push a real tag, which made
  # every change to it untestable-before-use: the first execution was always a
  # release someone wanted. That is the same gap that made me hold the
  # actions/checkout and azure/setup-helm bumps -- their green PR checks said
  # nothing about workflows no PR check runs.
  #
  # dry_run DEFAULTS TO TRUE. A dispatchable workflow with `packages: write` and
  # a publish step is one mis-click from an unintended release, so the safe
  # value is the default and publishing requires saying so explicitly.
  workflow_dispatch:
    inputs:
      version:
        description: "Version to stamp (e.g. 0.1.6). No tag is created."
        required: true
      dry_run:
        description: "Package and verify only -- no GHCR push, no index publish."
        required: false
        type: boolean
        default: true

permissions:
  # contents: write -- the stamped CompositionDefinition is attached to the release;
  # it is applied by hand and is not inside the packaged chart, so a copy that only
  # exists in the runner helps nobody.
  contents: write
  packages: write

jobs:
  package-and-push:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.resolve.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Helm
        uses: azure/setup-helm@v4

      - name: Resolve version and registry
        id: resolve
        run: |
          set -euo pipefail
          # On a tag the ref name IS the version; on a dispatch it is a branch
          # name, so the input supplies it. Asserted rather than defaulted: a
          # version of "main" would stamp charts with a branch name and publish
          # them.
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ inputs.version }}"
          else
            VERSION="${GITHUB_REF_NAME}"
          fi
          if ! printf '%s' "$VERSION" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::version '$VERSION' is not plain SemVer. On a tag this" \
                 "cannot happen; on a dispatch it means the input was wrong."
            exit 1
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "DRY_RUN=${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || false }}" >> "$GITHUB_ENV"
          echo "OCI_REPO=oci://ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/charts" >> "$GITHUB_ENV"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "resolved VERSION=$VERSION  DRY_RUN=${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || false }}"

      - name: Log in to GHCR
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | \
            helm registry login ghcr.io --username "${{ github.actor }}" --password-stdin

      - name: Stamp every CompositionDefinition
        run: |
          set -euo pipefail
          # The CD pins the version of THIS chart and does not live next to Chart.yaml, so the
          # per-chart stamping below never saw it. Left by hand it registered 0.1.0, which was
          # never published; core-provider accepts a stale registration silently.
          found=0
          while IFS= read -r -d '' cd; do
            sed -i "s/CHART_VERSION/${VERSION}/g" "$cd"; echo "stamped $cd -> ${VERSION}"; found=$((found+1))
          done < <(find . -type f -name compositiondefinition.yaml -not -path '*/charts/*' -print0)
          echo "CompositionDefinitions stamped: $found"

      - name: Package and push every chart
        run: |
          set -euo pipefail
          find . -type f -name Chart.yaml -not -path '*/charts/*' -print0 | while IFS= read -r -d '' cf; do
            dir=$(dirname "$cf")
            name=$(awk '/^name:/{print $2; exit}' "$cf")
            echo "::group::${name} (${dir})"
            # Stamp the CHART_VERSION placeholder, and pin the package version to the tag either way.
            sed -i "s/CHART_VERSION/${VERSION}/g" "$cf"

            # THE COMPOSITIONDEFINITION MUST TRAVEL INSIDE THE ARCHIVE, not only
            # as a release asset. The krateo-blueprints/charts publisher's
            # channel gate requires values.schema.json, an https icon AND a
            # compositiondefinition.yaml inside the .tgz. Ours lives at the repo
            # root, so `helm package chart/` never included it and this repo
            # could not be published to the index the portal Marketplace reads
            # -- which is why that index still serves 0.1.0, the auth-bridge
            # architecture deleted in #13.
            #
            # Copied rather than moved: the root file stays the single source of
            # truth for the release asset and for hack/assert-release-cd.py, and
            # it is already stamped by the step above, so the copy carries the
            # tag version too. A copy that silently stopped happening would be
            # invisible, so it is ASSERTED below rather than trusted.
            cd_root="./compositiondefinition.yaml"
            if [ -f "$cd_root" ] && [ ! -f "$dir/compositiondefinition.yaml" ]; then
              cp "$cd_root" "$dir/compositiondefinition.yaml"
              echo "staged compositiondefinition.yaml into ${dir}/ for the archive"
            fi

            helm dependency update "$dir" 2>/dev/null || true
            helm package "$dir" --version "${VERSION}" --destination .

            # ASSERT THE ARCHIVE ACTUALLY CARRIES IT. A missing CD does not make
            # `helm package` fail, and the publisher's gate would reject the
            # chart later, somewhere else, with a message about a channel rather
            # than about this. Checked here, where the cause is.
            # BOTH file-shaped gate requirements, not just the one that was
            # missing. Adopted from krateo-blueprints/charts#186, which took
            # this check from here and went one better by asserting
            # values.schema.json too -- ours happens to be in the archive
            # already, which is exactly why it would be the next thing to
            # silently stop being there. A check that only looks at the field
            # you once got wrong is a check that catches each defect once.
            missing=()
            for want in compositiondefinition.yaml values.schema.json; do
              # compositiondefinition.yaml is only required if this repo has one
              [ "$want" = "compositiondefinition.yaml" ] && [ ! -f "$cd_root" ] && continue
              if tar -tzf "${name}-${VERSION}.tgz" | grep -qx "${name}/${want}"; then
                echo "archive carries ${name}/${want}"
              else
                missing+=("${name}/${want}")
              fi
            done
            if [ "${#missing[@]}" -gt 0 ]; then
              echo "::error::${name}-${VERSION}.tgz is missing ${missing[*]}," \
                   "so this chart cannot pass the krateo-blueprints/charts" \
                   "channel gate. Refusing to push a chart that cannot be" \
                   "published to the index the portal Marketplace reads."
              tar -tzf "${name}-${VERSION}.tgz" | sed 's/^/  in archive: /'
              exit 1
            fi

            if [ "${DRY_RUN}" = "true" ]; then
              echo "DRY RUN: not pushing ${name}:${VERSION} to ${OCI_REPO}."
              echo "         everything above -- stamping, packaging and the"
              echo "         archive-contents assertions -- did run."
            else
              helm push "${name}-${VERSION}.tgz" "${OCI_REPO}"
              echo "Published ${OCI_REPO}/${name}:${VERSION}"
            fi
            echo "::endgroup::"
          done

      # THE PUBLISHER CONSUMES AN ARTIFACT, not the workspace: it runs as a
      # separate called workflow, so the .tgz files have to travel. `charts-dist`
      # is the name its `artifact` input defaults to.
      #
      # Uploaded even on a dry run, deliberately -- it is the cheapest way to
      # inspect exactly what WOULD have been published, and it is the half of
      # the publish path a dispatch can actually exercise.
      - name: Upload the packaged charts for the index publisher
        uses: actions/upload-artifact@v7
        with:
          name: charts-dist
          path: "*.tgz"
          if-no-files-found: error

      - name: Publish the stamped CompositionDefinitions on the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # Runs AFTER the charts are pushed: the chart is the primary artifact and an asset
          # problem must never block it. Staged copies -- a root-level CD cp'd onto itself is
          # an error, not a no-op (both lessons from krateo-selfservice-blueprint 0.2.26).
          stage="$(mktemp -d)"; assets=()
          while IFS= read -r -d '' cd; do
            d="$(dirname "$cd")"
            if [ "$d" = "." ]; then out="compositiondefinition.yaml"; else out="compositiondefinition-$(basename "$d").yaml"; fi
            cp "$cd" "$stage/$out"; assets+=("$stage/$out")
          done < <(find . -type f -name compositiondefinition.yaml -not -path '*/charts/*' -print0)
          [ ${#assets[@]} -eq 0 ] && { echo "no CompositionDefinition to publish"; exit 0; }
          gh release view "${VERSION}" >/dev/null 2>&1 \
            || gh release create "${VERSION}" --title "${VERSION}" --notes "Apply the attached CompositionDefinition to register this version."
          gh release upload "${VERSION}" "${assets[@]}" --clobber
          echo "attached: ${assets[*]}"

  # PUBLISH TO THE HELM INDEX THE PORTAL MARKETPLACE READS. Without this the
  # chart is pushed to GHCR on every tag and never LISTED, which is why that
  # index served 0.1.0 -- the nginx auth-bridge architecture deleted in #13 --
  # to every portal user. See the CAUTION in README and docs/usage.md.
  #
  # A FULL SHA, NOT `@1`: PUBLISHING.md rule 9, a rule this repo argued for.
  # That workflow receives an org-wide write-scoped secret, so whoever can move
  # a mutable ref runs code with it in every caller. dependabot.yml (#59) is how
  # upgrades then arrive as reviewed PRs instead of a pin nobody updates.
  # Tag -> SHA verified THREE times with
  # `git ls-remote https://github.com/krateo-blueprints/charts 'refs/tags/1.0.1^{}'`
  # -- when the SHA arrived, before the first wiring attempt, and before this one.
  #
  # 1.0.1 AND NOT 1.0.0, and the difference is a real failure not a version
  # bump: the first production publisher run (github-provider-kog 0.7.6) died at
  # "Clone gh-pages" because 1.0.0 embedded the token in the clone URL and the
  # org secret carried trailing whitespace. Verified in the two definitions --
  # `x-access-token:${GH_TOKEN}@` appears once in 1.0.0 and NOT AT ALL in 1.0.1
  # -- and 1.0.1 adds a shape check that refuses a token carrying whitespace or
  # a control character and names the remediation. DO NOT PIN 1.0.0.
  #
  # ON A TAG PUSH ONLY. A workflow_dispatch has no tag and the index must never
  # list a version with no tag behind it; the dispatch exists to exercise
  # packaging. So a non-dry-run dispatch can still reach GHCR in an emergency
  # while the index stays tag-derived.
  #
  # WHAT IS STILL UNPROVEN AT THE TIME OF WIRING, because a green tick here will
  # not say it: the 1.0.0 runs tested only the token's API path. Nobody has yet
  # seen a publisher run complete the clone, the store, the index write, the push
  # and the served-index check together. openstack 0.3.37 is expected to be that
  # first end-to-end test. So the first tag pushed from THIS repo after this
  # lands is either second in line or first, depending on timing -- and either
  # way the publisher's own write path has never run to completion for anyone.
  publish-to-index:
    needs: package-and-push
    if: github.event_name == 'push'
    uses: krateo-blueprints/charts/.github/workflows/publish-chart.yaml@36ea357cb0fe4b49628cc984d9939babf0049d03 # 1.0.1
    with:
      source_repo: ${{ github.repository }}
      git_tag: ${{ needs.package-and-push.outputs.version }}
      channel: blueprints
    secrets:
      PUBLISH_TOKEN: ${{ secrets.CHARTS_PUBLISH_TOKEN }}
