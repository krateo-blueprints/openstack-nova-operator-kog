# Packages every chart in this repo and publishes each to the GitHub Container Registry as an OCI
# Helm artifact on every semver tag. Shape-agnostic: it discovers charts by locating each Chart.yaml
# (skipping vendored subcharts under charts/), so it works regardless of the repo's directory layout.
#
# Charts opt into versioning with the CHART_VERSION placeholder in Chart.yaml, which the git tag
# replaces at publish time. Pushing tag "0.1.0" publishes each chart <name> as:
#   oci://ghcr.io/<owner>/charts/<name>:0.1.0
name: release-tag

on:
  push:
    tags: ["[0-9]+.[0-9]+.[0-9]+"]
  # DISPATCHABLE SO THE RELEASE PATH IS EXERCISABLE WITHOUT BURNING A VERSION.
  # Until now the only way to run any of this was to push a real tag, which made
  # every change to it untestable-before-use: the first execution was always a
  # release someone wanted. That is the same gap that made me hold the
  # actions/checkout and azure/setup-helm bumps -- their green PR checks said
  # nothing about workflows no PR check runs.
  #
  # dry_run DEFAULTS TO TRUE. A dispatchable workflow with `packages: write` and
  # a publish step is one mis-click from an unintended release, so the safe
  # value is the default and publishing requires saying so explicitly.
  workflow_dispatch:
    inputs:
      version:
        description: "Version to stamp (e.g. 0.1.6). No tag is created."
        required: true
      dry_run:
        description: "Package and verify only -- no GHCR push, no index publish."
        required: false
        type: boolean
        default: true
      publish_index:
        description: "Also publish to the shared blueprints index. Only for RECOVERING a release whose tag-push run failed after the tag already existed."
        required: false
        type: boolean
        default: false

permissions:
  # contents: write -- the stamped CompositionDefinition is attached to the release;
  # it is applied by hand and is not inside the packaged chart, so a copy that only
  # exists in the runner helps nobody.
  contents: write
  packages: write

jobs:
  # RULE 12. One shared last word before anything is pushed, and the reason it
  # is shared rather than copied: a precondition only this repository can state
  # (a fixture naming the version being released, say) gets written as a comment
  # and then missed -- openstack-neutron-operator-kog's example Composition
  # named v0-1-0 through 0.1.1. The shared job runs `hack/release-preflight`
  # with the version as $1 if one exists, FAILS if it exists and is not
  # executable (a lost mode bit would otherwise skip the guard exactly when it
  # was meant to fire), and passes saying so if there is none. This repo has no
  # hook yet; the job is still adopted, because the version check below it is
  # the half that matters today.
  #
  # VERIFIED AT THIS PIN, NOT TAKEN ON TRUST. charts 1.4.3's tag object is
  # c0855c4d89e0669f8cb9750112eec06d95f77abf and peels to the commit below
  # (`git ls-remote ... 'refs/tags/1.4.3^{}'`, with the remote's 1565 tag refs
  # as the control that an empty answer would not have been a missing tag).
  # release-preflight.yaml at that commit is 4656 bytes, sha256
  # e27c6df30d6fe734969268b01f5f7794641e2b42b94bd822c4d72d33e8ebb547.
  # hack/validate-shared-preflight.py re-checks the substance on every PR.
  release-preflight:
    uses: krateo-blueprints/charts/.github/workflows/release-preflight.yaml@70095ab05f1c5dc6c8dd39d0b1fdbbc7382a841c # 1.4.3
    permissions:
      contents: read
    with:
      version: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}

  package-and-push:
    needs: release-preflight
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.resolve.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Helm
        uses: azure/setup-helm@v5

      - name: Resolve version and registry
        id: resolve
        run: |
          set -euo pipefail
          # On a tag the ref name IS the version; on a dispatch it is a branch
          # name, so the input supplies it. Asserted rather than defaulted: a
          # version of "main" would stamp charts with a branch name and publish
          # them.
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ inputs.version }}"
          else
            VERSION="${GITHUB_REF_NAME}"
          fi
          # NO LEADING ZEROS, so the publisher's rule 13 can never be the first
          # thing to refuse a version. Measured against rule 13's own regex: the
          # two gates agreed on every case tried except `01.1.0`, which ours
          # accepted and the publisher now rejects -- that would have failed the
          # release at PUBLISH time, jobs after the cause. This file's own comment
          # states the principle: checked here, where the cause is.
          #
          # THE VERSION-SHAPE CHECK THAT WAS HERE IS GONE, and deliberately: the
          # shared release-preflight job above enforces rule 13's pattern, this
          # job `needs:` it, so a bad version fails before anything is pushed --
          # strictly earlier than here. Two copies of one pattern is the defect
          # this repo spends its time removing, and the shared one is the copy
          # publish-chart.yaml's own test keeps in step
          # (test/release-preflight/run-cases.py fails if they differ).
          #
          # NOT A LEAP OF FAITH: hack/validate-shared-preflight.py reads the pin
          # out of this file, fetches release-preflight.yaml AT THAT COMMIT, and
          # requires it to refuse every version this check refused and accept
          # every one it accepted. Run on every PR. If the pin ever moves to a
          # preflight that does not check the version, that gate fails -- which
          # is what makes removing this safe rather than merely tidier.
          #
          # WHAT DID NOT MOVE is the publish_index tag-existence check below.
          # release-preflight does not cover it, so retiring this block wholesale
          # would have silently dropped it.
          # PUBLISHING TO THE SHARED INDEX REQUIRES A TAG THAT EXISTS. The
          # publisher takes `git_tag` from this version, so a dispatch naming a
          # version nobody ever tagged would ask 29 repositories' index to carry
          # a reference that resolves to nothing. On a tag push this is true by
          # construction; on a recovery dispatch it has to be checked.
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] \
             && [ "${{ inputs.publish_index }}" = "true" ]; then
            git fetch --tags --quiet origin
            if ! git rev-parse --verify --quiet "refs/tags/$VERSION" > /dev/null; then
              echo "::error::publish_index was requested for '$VERSION', but no such" \
                   "tag exists. The index would carry a reference to nothing." \
                   "Tag it first, or re-run without publish_index."
              exit 1
            fi
            # And the control on that check: the fetch must have brought SOME
            # tag, or `rev-parse` fails for a reason that has nothing to do with
            # this version -- the same unreadable negative this repo keeps
            # finding in its own gates.
            if [ "$(git tag --list | grep -c . || true)" -eq 0 ]; then
              echo "::error::no tags at all are visible after a fetch, so the" \
                   "tag check above could not have passed for any version." \
                   "That is a VOID, not a missing tag."
              exit 1
            fi
            echo "tag refs/tags/$VERSION exists; index publish may proceed"
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "DRY_RUN=${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || false }}" >> "$GITHUB_ENV"
          echo "OCI_REPO=oci://ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/charts" >> "$GITHUB_ENV"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "resolved VERSION=$VERSION  DRY_RUN=${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || false }}"

      - name: Log in to GHCR
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | \
            helm registry login ghcr.io --username "${{ github.actor }}" --password-stdin

      # LOCATE MODE: the action only tells us where its push.sh is; this job
      # runs it, so the credentials below stay in this workflow's env and are
      # never handed to a step we do not control.
      #
      # PINNED BY COMMIT, NOT BY A BRANCH, and deliberately unlike this repo's
      # three recorded `@main` floats: those are org-owned reusables that buy no
      # review gate by being pinned, while this one RECEIVES A REGISTRY
      # CREDENTIAL. Same trust-boundary reasoning as the chart publisher in this
      # same file -- different exposure, different answer.
      - name: Locate the shared chart-push script
        id: chart-push
        # PINNED TO A TAG RATHER THAN A BARE COMMIT, which this repo's own
        # rule-9 convention prefers: a SHA plus a version comment. The move was
        # safe because the pin changed and THE REVIEWED FILE DID NOT -- push.sh
        # was byte-identical before and after, which made it a re-pinning rather
        # than a new review.
        #
        # THE SHAs THAT WERE HERE ARE GONE ON PURPOSE. This comment carried the
        # previously-reviewed commit (7-hex, a different commit from the pin)
        # and the file's sha256 (a content digest, not a pin). Neither was an
        # instance of PUBLISHING.md's pin-copy rule as corrected in charts#32 --
        # that rule is about a 40-hex comment SHA equal to a `uses:` pin in the
        # same file -- and an earlier version of this comment claimed otherwise.
        # They are still better gone: the next bump would leave both describing
        # a file this workflow no longer runs. To re-verify, resolve the tag and
        # read the file at it:
        #
        #   git ls-remote https://github.com/krateo-platformops/.github 'refs/tags/1.0.0^{}'
        #
        # which must equal the SHA on the `uses:` line below. An empty answer
        # means the remote was not reached; confirm with `git ls-remote --tags`
        # before reading anything into it. Checked that way on 2026-11-18, with
        # that control, and it matches.
        uses: krateo-platformops/.github/.github/actions/chart-push@e1d3e99215e80ae56eca4a67e9e061b2c73168b8 # 1.0.0

      - name: Stamp every CompositionDefinition
        run: |
          set -euo pipefail
          # The CD pins the version of THIS chart and does not live next to Chart.yaml, so the
          # per-chart stamping below never saw it. Left by hand it registered 0.1.0, which was
          # never published; core-provider accepts a stale registration silently.
          found=0
          while IFS= read -r -d '' cd; do
            sed -i "s/CHART_VERSION/${VERSION}/g" "$cd"; echo "stamped $cd -> ${VERSION}"; found=$((found+1))
          done < <(find . -type f -name compositiondefinition.yaml -not -path '*/charts/*' -print0)
          echo "CompositionDefinitions stamped: $found"

      - name: Package and push every chart
        env:
          CHART_PUSH: ${{ steps.chart-push.outputs.path }}
          REGISTRY_USERNAME: ${{ github.actor }}
          REGISTRY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          find . -type f -name Chart.yaml -not -path '*/charts/*' -print0 | while IFS= read -r -d '' cf; do
            dir=$(dirname "$cf")
            name=$(awk '/^name:/{print $2; exit}' "$cf")
            echo "::group::${name} (${dir})"
            # Stamp the CHART_VERSION placeholder, and pin the package version to the tag either way.
            sed -i "s/CHART_VERSION/${VERSION}/g" "$cf"

            # THE COMPOSITIONDEFINITION MUST TRAVEL INSIDE THE ARCHIVE, not only
            # as a release asset. The krateo-blueprints/charts publisher's
            # channel gate requires values.schema.json, an https icon AND a
            # compositiondefinition.yaml inside the .tgz. Ours lives at the repo
            # root, so `helm package chart/` never included it and this repo
            # could not be published to the index the portal Marketplace reads
            # -- which is why that index still serves 0.1.0, the auth-bridge
            # architecture deleted in #13.
            #
            # Copied rather than moved: the root file stays the single source of
            # truth for the release asset and for hack/assert-release-cd.py, and
            # it is already stamped by the step above, so the copy carries the
            # tag version too. A copy that silently stopped happening would be
            # invisible, so it is ASSERTED below rather than trusted.
            cd_root="./compositiondefinition.yaml"
            staged_cd=""
            if [ -f "$cd_root" ] && [ ! -f "$dir/compositiondefinition.yaml" ]; then
              cp "$cd_root" "$dir/compositiondefinition.yaml"
              staged_cd="$dir/compositiondefinition.yaml"
              echo "staged compositiondefinition.yaml into ${dir}/ for the archive"
            fi

            helm dependency update "$dir" 2>/dev/null || true
            helm package "$dir" --version "${VERSION}" --destination .

            # ASSERT THE ARCHIVE ACTUALLY CARRIES IT. A missing CD does not make
            # `helm package` fail, and the publisher's gate would reject the
            # chart later, somewhere else, with a message about a channel rather
            # than about this. Checked here, where the cause is.
            # BOTH file-shaped gate requirements, not just the one that was
            # missing. Adopted from krateo-blueprints/charts#186, which took
            # this check from here and went one better by asserting
            # values.schema.json too -- ours happens to be in the archive
            # already, which is exactly why it would be the next thing to
            # silently stop being there. A check that only looks at the field
            # you once got wrong is a check that catches each defect once.
            # ONE LISTING, READ FROM A FILE, AND THE REASON IS A FAILED RELEASE.
            #
            # This was `tar -tzf ... | grep -qx ...` under `set -o pipefail`, and
            # on 2026-11-18 it refused the 0.1.9 release with
            #
            #     tar: stdout: write error
            #     ::error:: ...-0.1.9.tgz is missing .../values.schema.json
            #       in archive: openstack-nova-operator-kog/values.schema.json   <- two lines later
            #
            # The file WAS in the archive. `grep -q` exits the moment it matches;
            # `values.schema.json` is the THIRD of 24 entries, so tar still had
            # most of its listing to write, got EPIPE, and exited non-zero --
            # which `pipefail` promotes to the pipeline's status, so a successful
            # match read as a missing file.
            #
            # IT IS A RACE, NOT A BROKEN CHECK, which is why it is worse than a
            # plain bug. Identical code passed at 0.1.8 and passes on a laptop:
            # whether tar is still writing when grep exits depends on the pipe
            # buffer. The gate was correct, flaky, and silent about which it was
            # being. `compositiondefinition.yaml` is entry 23 and passed in the
            # same run, because grep had almost nothing left to drain.
            #
            # A FILE REMOVES THE RACE ENTIRELY, and one tar instead of N is a
            # side benefit rather than the point.
            list=$(mktemp)
            tar -tzf "${name}-${VERSION}.tgz" > "$list"
            # The listing must be non-empty, or every name below is "missing"
            # for a reason that has nothing to do with the archive's contents --
            # the same unreadable-negative shape one level down.
            if [ ! -s "$list" ]; then
              echo "::error::tar listed NOTHING for ${name}-${VERSION}.tgz, so the" \
                   "contents gate examined nothing. That is a VOID, not a pass," \
                   "and not evidence about any file."
              exit 1
            fi
            missing=()
            for want in compositiondefinition.yaml values.schema.json; do
              # compositiondefinition.yaml is only required if this repo has one
              [ "$want" = "compositiondefinition.yaml" ] && [ ! -f "$cd_root" ] && continue
              if grep -qx "${name}/${want}" "$list"; then
                echo "archive carries ${name}/${want}"
              else
                missing+=("${name}/${want}")
              fi
            done
            if [ "${#missing[@]}" -gt 0 ]; then
              echo "::error::${name}-${VERSION}.tgz is missing ${missing[*]}," \
                   "so this chart cannot pass the krateo-blueprints/charts" \
                   "channel gate. Refusing to push a chart that cannot be" \
                   "published to the index the portal Marketplace reads."
              sed 's/^/  in archive: /' "$list"
              exit 1
            fi

            if [ "${DRY_RUN}" = "true" ]; then
              echo "DRY RUN: not pushing ${name}:${VERSION} to ${OCI_REPO}."
              echo "         everything above -- stamping, packaging and the"
              echo "         archive-contents assertions -- did run."
            else
              # RULE 14: the chart reaches the registry through the shared
              # script, never through this workflow's own push. The script
              # retries GHCR's tag race -- and only that -- onto the SAME
              # digest, which is the failure mode that made this repo's 0.1.9
              # release need a hand-driven recovery.
              #
              # THE CREDENTIAL REVIEW THAT PRECEDED ADOPTING IT, because handing
              # a shared script a registry password is a trust decision and not
              # a refactor. Both pins verified independently -- the 1.4.0 tag
              # peels to its stated commit and both files hash to what was
              # published -- and push.sh was READ first. Its first version put
              # the password on curl's command line (`-u user:pass`), where
              # every process in the job can read it via /proc/<pid>/cmdline.
              # Reported; fixed in platformops#63; re-verified here by reading
              # the new script rather than the changelog: no -u, no --user, no
              # --password, no Authorization header on argv, no `set -x`, no
              # echo of the credential, no write to a file, and the credential
              # and bearer token both reach curl as a config on stdin (`-K -`),
              # sent only to a token service on the registry's own host, with a
              # line break in a credential refused because it would start
              # another config option.
              bash "${CHART_PUSH}" "${name}-${VERSION}.tgz" "${OCI_REPO}"
              echo "Published ${OCI_REPO}/${name}:${VERSION}"

              # ASK THE REGISTRY, NOT THE EXIT CODE. `helm push` succeeding is
              # not the same event as the artifact being pullable, and a green
              # release run is the weakest evidence there is that a release
              # happened: oasgen-provider tagged 0.83.0 on 2026-11-18 behind a
              # run that reported SUCCESS and published NOTHING -- no image, no
              # chart -- because a skipped `needs` dependency skips the
              # dependent job with no error and a tick on the summary. Every
              # signal a reasonable person checks on a release (conclusion,
              # check count, failure count) said it worked. Only a registry
              # probe could tell.
              #
              # This repo's 0.1.7 WAS verified that way -- by hand, because I
              # remembered. That is not a control.
              if ! helm show chart "${OCI_REPO}/${name}" --version "${VERSION}" > /dev/null 2>&1; then
                echo "PUBLISH FAILED SILENTLY: the push exited 0 and"
                echo "  ${OCI_REPO}/${name}:${VERSION} is not pullable."
                echo "  The run would otherwise have reported success."
                exit 1
              fi
              # NEGATIVE CONTROL, in the same breath. Without it a probe that
              # always succeeds -- a registry answering 200 to anything, a flag
              # that stopped meaning what it means -- reads as confirmation.
              bogus="9999.0.0-definitely-not-published"
              if helm show chart "${OCI_REPO}/${name}" --version "$bogus" > /dev/null 2>&1; then
                echo "PROBE IS NOT A PROBE: ${OCI_REPO}/${name}:${bogus} also"
                echo "  resolved, so the positive result above proves nothing."
                exit 1
              fi
              echo "verified pullable: ${OCI_REPO}/${name}:${VERSION} (and ${bogus} correctly absent)"
            fi

            # THE STAGED COPY IS TRANSIENT AND MUST NOT OUTLIVE PACKAGING. It
            # exists only so `helm package` includes it. Left in place it is
            # also found by the release-asset step's `find`, which then attaches
            # a SECOND asset named after its directory --
            # `compositiondefinition-chart.yaml` -- a duplicate of the root one.
            # Observed on the first real run of this path: release 0.1.6 carried
            # both. `-not -path '*/charts/*'` does not exclude it, because this
            # chart lives in `chart/` (singular).
            if [ -n "$staged_cd" ]; then
              rm -f "$staged_cd"
              echo "removed the staged ${staged_cd} (it belongs in the archive, not the asset list)"
            fi
            echo "::endgroup::"
          done

      # THE PUBLISHER CONSUMES AN ARTIFACT, not the workspace: it runs as a
      # separate called workflow, so the .tgz files have to travel. `charts-dist`
      # is the name its `artifact` input defaults to.
      #
      # Uploaded even on a dry run, deliberately -- it is the cheapest way to
      # inspect exactly what WOULD have been published, and it is the half of
      # the publish path a dispatch can actually exercise.
      - name: Upload the packaged charts for the index publisher
        uses: actions/upload-artifact@v7
        with:
          name: charts-dist
          path: "*.tgz"
          if-no-files-found: error

      - name: Publish the stamped CompositionDefinitions on the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # A DRY RUN MUST NOT CREATE A RELEASE, AND `gh release create` CREATES
          # A TAG. This step had no DRY_RUN reference at all: the first dry run
          # dispatched against main created a real release 0.1.6 and tag 0.1.6
          # for a chart that was never pushed -- a CompositionDefinition pinning
          # a version absent from the registry, which is exactly the defect PR
          # #11 fixed once already, and it broke the chart-version guard on
          # every branch because the newest tag stopped matching the docs.
          #
          # Gating `helm push` and forgetting this one is the whole lesson: "dry
          # run" is a property of EVERY mutating step, not of the one you were
          # thinking about. scripts/validate.py now asserts that each mutating
          # step in this file references DRY_RUN, so the next one cannot be
          # forgotten silently.
          if [ "${DRY_RUN}" = "true" ]; then
            echo "DRY RUN: not creating a release or uploading assets."
            echo "         The stamped CompositionDefinition(s) would have been"
            echo "         attached to release ${VERSION}."
            exit 0
          fi
          # Runs AFTER the charts are pushed: the chart is the primary artifact and an asset
          # problem must never block it. Staged copies -- a root-level CD cp'd onto itself is
          # an error, not a no-op (both lessons from krateo-selfservice-blueprint 0.2.26).
          stage="$(mktemp -d)"; assets=()
          while IFS= read -r -d '' cd; do
            d="$(dirname "$cd")"
            if [ "$d" = "." ]; then out="compositiondefinition.yaml"; else out="compositiondefinition-$(basename "$d").yaml"; fi
            cp "$cd" "$stage/$out"; assets+=("$stage/$out")
          done < <(find . -type f -name compositiondefinition.yaml -not -path '*/charts/*' -print0)
          [ ${#assets[@]} -eq 0 ] && { echo "no CompositionDefinition to publish"; exit 0; }
          # Not `view || create`: release-notes creates the same release on the same tag push, and losing
          # that race failed glance-kog 0.1.2 (422 "already exists"). The script treats a concurrent create
          # as success and still fails on any other error (hack/test-publish-release-assets.sh).
          bash hack/publish-release-assets.sh "${VERSION}" "${assets[@]}"
          echo "attached: ${assets[*]}"

  # PUBLISH TO THE HELM INDEX THE PORTAL MARKETPLACE READS. Without this the
  # chart is pushed to GHCR on every tag and never LISTED, which is why that
  # index served 0.1.0 -- the nginx auth-bridge architecture deleted in #13 --
  # to every portal user. See the CAUTION in README and docs/usage.md.
  #
  # A FULL SHA, NOT `@1`: PUBLISHING.md rule 9, a rule this repo argued for.
  # That workflow receives an org-wide write-scoped secret, so whoever can move
  # a mutable ref runs code with it in every caller. dependabot.yml (#59) is how
  # upgrades then arrive as reviewed PRs instead of a pin nobody updates.
  # Tag -> SHA verified at every pin change with
  # `git ls-remote https://github.com/krateo-blueprints/charts 'refs/tags/<v>^{}'`
  # -- 1.0.0 twice, 1.0.1 once, 1.0.2 once. Three pins in one evening is why the
  # SHA is re-checked rather than carried forward from a message.
  #
  # 1.0.1 AND NOT 1.0.0, and the difference is a real failure not a version
  # bump: the first production publisher run (github-provider-kog 0.7.6) died at
  # "Clone gh-pages" because 1.0.0 embedded the token in the clone URL and the
  # org secret carried trailing whitespace. Verified in the two definitions --
  # `x-access-token:${GH_TOKEN}@` appears once in 1.0.0 and NOT AT ALL in 1.0.1
  # -- and 1.0.1 adds a shape check that refuses a token carrying whitespace or
  # a control character and names the remediation. DO NOT PIN 1.0.0.
  #
  # ON A TAG PUSH ONLY. A workflow_dispatch has no tag and the index must never
  # list a version with no tag behind it; the dispatch exists to exercise
  # packaging. So a non-dry-run dispatch can still reach GHCR in an emergency
  # while the index stays tag-derived.
  #
  # FOUR PINS IN ONE EVENING, each a real failure rather than churn. HISTORY,
  # not the current pin -- which is named once, on the `uses:` line below, and
  # nowhere else:
  #   1.0.0  embedded the token in the clone URL; died at "Clone gh-pages"
  #   1.0.1  lost a gh-pages race when another publish landed between clone
  #          and push -- with 29 repos writing one branch that is the normal
  #          case on a busy afternoon, not an edge case
  #   1.0.2  retries that race (6-attempt backoff + a merge-and-push retry)
  #   1.0.3  case-insensitive repository names
  #
  # The marker "<- pinned here" used to sit on the 1.0.3 row and stayed there
  # while the pin moved to 1.4.2 and then 1.4.3, so the table asserted that a
  # version nobody pins was pinned. Found by the agreement rule now being built
  # into pinned-uses, whose single live finding across 390 pins in 104 repos was
  # this line. It is the same shape as lint.yaml's old "whose tag peels to this
  # commit" and the same fix: the history keeps its versions, and the claim
  # about which one is current is deleted rather than maintained.
  #
  # The SHA is re-verified from the tag at every change rather than carried
  # forward from a message, because four moves in an evening is exactly when a
  # stale 40-character string stops being noticed.
  #
  # THE 0.1.0 ENTRY STILL NAMES THE DEAD ORG, AND IT NO LONGER MATTERS. Read
  # from the served index on 2026-11-18, with 819 charts in `entries` as the
  # control that the index was actually parsed:
  #
  #   0.1.9  2026-11-18T12:03:56  sources: krateo-blueprints/...
  #   0.1.8  2026-11-18T09:56:18  sources: krateo-blueprints/...
  #   0.1.7  2026-11-17T22:06:08  sources: krateo-blueprints/...
  #   0.1.6  2026-11-09T19:37:45  sources: krateo-blueprints/...
  #   0.1.0  2026-08-19T04:26:00  sources: braghettos/...        <- the dead org
  #
  # Portal 1.8.95 (#383) shows live-index versions for charts whose NEWEST
  # `sources:` names a krateo-blueprints repo. The newest is 0.1.9 and it does,
  # so this chart qualifies; the stale 0.1.0 field is now inert history rather
  # than the thing keeping us on the snapshot.
  #
  # THE WRITE PATH IS PROVEN, and verified here rather than taken on report.
  # Read from the SERVED index, not from a peer's summary:
  #
  #   blueprints/index.yaml   37 charts at 0.3.37 (aodh, barbican, blazar, ...)
  #                           selfservice-krateo 0.2.58
  #   operators/index.yaml    github-provider-kog 0.7.6, among 93 charts
  #
  # The first lookup attempted was by REPOSITORY name and found nothing, because
  # that umbrella publishes 37 component charts rather than one chart named
  # after its repo. The instrument was wrong, not the claim -- worth recording
  # because "not listed" read as a contradiction when it was a bad query.
  #
  # THIS PATH IS NOW PROVEN FOR US SPECIFICALLY, and this paragraph used to say
  # the opposite: "this chart has never been published by this path ... appears
  # with ONE entry, 0.1.0". True when written, false since 0.1.6. Four versions
  # (0.1.6, 0.1.7, 0.1.8, 0.1.9) reached the index through this job, each read
  # back from the served file rather than from a run conclusion.
  #
  # `channel: blueprints` below remains correct and measured, not a guess: our
  # chart is present in blueprints/index.yaml and ABSENT from
  # operators/index.yaml (186848 bytes, our name on 0 lines), and the
  # publisher's content gate refuses a blueprint sent to operators.
  publish-to-index:
    needs: package-and-push
    # PUSH ALWAYS, DISPATCH ONLY WHEN ASKED -- and the asking is the point.
    #
    # This was `github.event_name == 'push'` alone, which is right about the
    # hazard and wrong about recovery. The guard exists so a manual or dry run
    # cannot write to an index 29 repositories share. But on 2026-11-18 the
    # 0.1.9 tag-push run failed in `package-and-push` (a `grep -q` race, fixed
    # separately), and the recovery route the workflow documents -- dispatch with
    # the same version and dry_run=false -- republished to GHCR and SILENTLY
    # COULD NOT update the index. The chart was pullable by `oci://` reference
    # and absent from the index the portal Marketplace reads, which is a
    # half-released state nothing reported: both jobs were green, one of them by
    # being skipped.
    #
    # So the hazard keeps its guard and recovery gets a door: the index publish
    # requires publish_index to be set explicitly AND dry_run to be false, so no
    # default, no dry run and no mis-click can reach the shared index.
    if: >-
      github.event_name == 'push' ||
      (github.event_name == 'workflow_dispatch' &&
       inputs.publish_index == true && inputs.dry_run == false)
    uses: krateo-blueprints/charts/.github/workflows/publish-chart.yaml@70095ab05f1c5dc6c8dd39d0b1fdbbc7382a841c # 1.4.3
    with:
      source_repo: ${{ github.repository }}
      git_tag: ${{ needs.package-and-push.outputs.version }}
      channel: blueprints
    secrets:
      PUBLISH_TOKEN: ${{ secrets.CHARTS_PUBLISH_TOKEN }}
