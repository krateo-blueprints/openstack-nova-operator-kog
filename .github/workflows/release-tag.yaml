# Packages every chart in this repo and publishes each to the GitHub Container Registry as an OCI
# Helm artifact on every semver tag. Shape-agnostic: it discovers charts by locating each Chart.yaml
# (skipping vendored subcharts under charts/), so it works regardless of the repo's directory layout.
#
# Charts opt into versioning with the CHART_VERSION placeholder in Chart.yaml, which the git tag
# replaces at publish time. Pushing tag "0.1.0" publishes each chart <name> as:
#   oci://ghcr.io/<owner>/charts/<name>:0.1.0
name: release-tag

on:
  push:
    tags: ["[0-9]+.[0-9]+.[0-9]+"]

permissions:
  # contents: write -- the stamped CompositionDefinition is attached to the release;
  # it is applied by hand and is not inside the packaged chart, so a copy that only
  # exists in the runner helps nobody.
  contents: write
  packages: write

jobs:
  package-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Helm
        uses: azure/setup-helm@v4

      - name: Resolve version and registry
        run: |
          echo "VERSION=${GITHUB_REF_NAME}" >> "$GITHUB_ENV"
          echo "OCI_REPO=oci://ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/charts" >> "$GITHUB_ENV"

      - name: Log in to GHCR
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | \
            helm registry login ghcr.io --username "${{ github.actor }}" --password-stdin

      - name: Stamp every CompositionDefinition
        run: |
          set -euo pipefail
          # The CD pins the version of THIS chart and does not live next to Chart.yaml, so the
          # per-chart stamping below never saw it. Left by hand it registered 0.1.0, which was
          # never published; core-provider accepts a stale registration silently.
          found=0
          while IFS= read -r -d '' cd; do
            sed -i "s/CHART_VERSION/${VERSION}/g" "$cd"; echo "stamped $cd -> ${VERSION}"; found=$((found+1))
          done < <(find . -type f -name compositiondefinition.yaml -not -path '*/charts/*' -print0)
          echo "CompositionDefinitions stamped: $found"

      - name: Package and push every chart
        run: |
          set -euo pipefail
          find . -type f -name Chart.yaml -not -path '*/charts/*' -print0 | while IFS= read -r -d '' cf; do
            dir=$(dirname "$cf")
            name=$(awk '/^name:/{print $2; exit}' "$cf")
            echo "::group::${name} (${dir})"
            # Stamp the CHART_VERSION placeholder, and pin the package version to the tag either way.
            sed -i "s/CHART_VERSION/${VERSION}/g" "$cf"

            # THE COMPOSITIONDEFINITION MUST TRAVEL INSIDE THE ARCHIVE, not only
            # as a release asset. The krateo-blueprints/charts publisher's
            # channel gate requires values.schema.json, an https icon AND a
            # compositiondefinition.yaml inside the .tgz. Ours lives at the repo
            # root, so `helm package chart/` never included it and this repo
            # could not be published to the index the portal Marketplace reads
            # -- which is why that index still serves 0.1.0, the auth-bridge
            # architecture deleted in #13.
            #
            # Copied rather than moved: the root file stays the single source of
            # truth for the release asset and for hack/assert-release-cd.py, and
            # it is already stamped by the step above, so the copy carries the
            # tag version too. A copy that silently stopped happening would be
            # invisible, so it is ASSERTED below rather than trusted.
            cd_root="./compositiondefinition.yaml"
            if [ -f "$cd_root" ] && [ ! -f "$dir/compositiondefinition.yaml" ]; then
              cp "$cd_root" "$dir/compositiondefinition.yaml"
              echo "staged compositiondefinition.yaml into ${dir}/ for the archive"
            fi

            helm dependency update "$dir" 2>/dev/null || true
            helm package "$dir" --version "${VERSION}" --destination .

            # ASSERT THE ARCHIVE ACTUALLY CARRIES IT. A missing CD does not make
            # `helm package` fail, and the publisher's gate would reject the
            # chart later, somewhere else, with a message about a channel rather
            # than about this. Checked here, where the cause is.
            # BOTH file-shaped gate requirements, not just the one that was
            # missing. Adopted from krateo-blueprints/charts#186, which took
            # this check from here and went one better by asserting
            # values.schema.json too -- ours happens to be in the archive
            # already, which is exactly why it would be the next thing to
            # silently stop being there. A check that only looks at the field
            # you once got wrong is a check that catches each defect once.
            missing=()
            for want in compositiondefinition.yaml values.schema.json; do
              # compositiondefinition.yaml is only required if this repo has one
              [ "$want" = "compositiondefinition.yaml" ] && [ ! -f "$cd_root" ] && continue
              if tar -tzf "${name}-${VERSION}.tgz" | grep -qx "${name}/${want}"; then
                echo "archive carries ${name}/${want}"
              else
                missing+=("${name}/${want}")
              fi
            done
            if [ "${#missing[@]}" -gt 0 ]; then
              echo "::error::${name}-${VERSION}.tgz is missing ${missing[*]}," \
                   "so this chart cannot pass the krateo-blueprints/charts" \
                   "channel gate. Refusing to push a chart that cannot be" \
                   "published to the index the portal Marketplace reads."
              tar -tzf "${name}-${VERSION}.tgz" | sed 's/^/  in archive: /'
              exit 1
            fi

            helm push "${name}-${VERSION}.tgz" "${OCI_REPO}"
            echo "Published ${OCI_REPO}/${name}:${VERSION}"
            echo "::endgroup::"
          done

      - name: Publish the stamped CompositionDefinitions on the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # Runs AFTER the charts are pushed: the chart is the primary artifact and an asset
          # problem must never block it. Staged copies -- a root-level CD cp'd onto itself is
          # an error, not a no-op (both lessons from krateo-selfservice-blueprint 0.2.26).
          stage="$(mktemp -d)"; assets=()
          while IFS= read -r -d '' cd; do
            d="$(dirname "$cd")"
            if [ "$d" = "." ]; then out="compositiondefinition.yaml"; else out="compositiondefinition-$(basename "$d").yaml"; fi
            cp "$cd" "$stage/$out"; assets+=("$stage/$out")
          done < <(find . -type f -name compositiondefinition.yaml -not -path '*/charts/*' -print0)
          [ ${#assets[@]} -eq 0 ] && { echo "no CompositionDefinition to publish"; exit 0; }
          gh release view "${VERSION}" >/dev/null 2>&1 \
            || gh release create "${VERSION}" --title "${VERSION}" --notes "Apply the attached CompositionDefinition to register this version."
          gh release upload "${VERSION}" "${assets[@]}" --clobber
          echo "attached: ${assets[*]}"
