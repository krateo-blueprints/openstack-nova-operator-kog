# Example Composition for the OpenStack Nova KOG blueprint.
#
# Applying this CR installs the KOG operator packaging: the RestDefinitions
# you toggle below. It does NOT create individual Nova resources.
#
# The CRD below is generated by crdgen from chart/values.schema.json via the
# CompositionDefinition (see ../../compositiondefinition.yaml):
#   group   = composition.krateo.io
#   version = "v" + the FULL chart version, dots -> dashes.
#             chart 0.1.3 -> v0-1-3. This includes the PATCH, so the served
#             apiVersion moves on every release and the literal below goes
#             stale. Read the real one off the object instead of trusting it:
#
#               kubectl get compositiondefinition openstack-nova-operator-kog \
#                 -n krateo-system -o jsonpath='{.status.apiVersion}'
#
#             A wrong version fails as `no matches for kind ...`, which is
#             indistinguishable at the CLI from the CRD not existing at all.
#   kind    = OpenstackNovaOperatorKog  (PascalCase of the CD metadata.name)
#
# Once installed, create the per-resource CRs (Instance / ComputeFlavor /
# ComputeKeypair / ...). Worked examples live in chart/samples/
# (nova-auth.yaml, test-server.yaml, extra-resources.yaml).
#
#   kubectl create namespace openstack
#   kubectl apply -f examples/nova-composition/composition.yaml
apiVersion: composition.krateo.io/v0-1-3   # chart 0.1.3 - CHECK status.apiVersion
kind: OpenstackNovaOperatorKog
metadata:
  name: openstack-nova-operator-kog
  namespace: openstack
spec:
  nova:
    enabled: true
    # The key user input: the region-specific Nova endpoint from your
    # Keystone service catalog. Replace <projectId> with your project id.
    upstreamUrl: https://compute.gra11.cloud.ovh.net/v2.1/<projectId>
  restdefinitions:
    server:
      enabled: true
    flavor:
      enabled: true
    keypair:
      enabled: false
    server_group:
      enabled: false
    aggregate:
      enabled: false
    quota:
      enabled: false
