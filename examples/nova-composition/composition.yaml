# Example Composition for the OpenStack Nova KOG blueprint.
#
# Applying this CR installs the KOG operator packaging: the RestDefinitions
# you toggle below. It does NOT create individual Nova resources.
#
# The CRD below is generated by crdgen from chart/values.schema.json via the
# CompositionDefinition (see ../../compositiondefinition.yaml):
#   group   = composition.krateo.io
#   version = "v" + the FULL chart version, dots -> dashes.
#             chart 0.1.3 -> v0-1-3. This includes the PATCH, so the served
#             apiVersion moves on every release and the literal below goes
#             stale. Read the real one off the object instead of trusting it:
#
#               kubectl get compositiondefinition openstack-nova-operator-kog \
#                 -n krateo-system -o jsonpath='{.status.apiVersion}'
#
#             A wrong version fails as `no matches for kind ...`, which is
#             indistinguishable at the CLI from the CRD not existing at all.
#   kind    = OpenstackNovaOperatorKog  (PascalCase of the CD metadata.name)
#
# Once installed, create the per-resource CRs (Instance / ComputeFlavor /
# ComputeKeypair / ...). Worked examples live in chart/samples/
# (nova-auth.yaml, test-server.yaml, extra-resources.yaml).
#
#   kubectl create namespace openstack
#
#   # Wait on the CONDITION, not on a non-empty string. Since core-provider
#   # 2.13.39 an unresolvable chart sets Ready=False with reason Unavailable
#   # and the registry error in the message, so this fails fast and says WHY.
#   # Polling for a non-empty .status.apiVersion instead just spins to the
#   # timeout and explains nothing.
#   kubectl wait compositiondefinition/openstack-nova-operator-kog \
#     -n krateo-system --for=condition=Ready --timeout=300s
#
#   # Waiting for the CompositionDefinition to be Ready is NOT sufficient:
#   # core-provider sets Available() after WRITING the CRD, reading back only
#   # crd.Spec fields, so it cannot distinguish an accepted CRD from a served
#   # one (core-provider#269 -- IsReady() checking Established exists with zero
#   # callers). Gate on the CRD itself before applying this Composition:
#   kubectl wait --for=condition=Established \
#     "crd/$(kubectl get compositiondefinition openstack-nova-operator-kog \
#              -n krateo-system -o jsonpath='{.status.resource}').composition.krateo.io" \
#     --timeout=300s
#
#   API=$(kubectl get compositiondefinition openstack-nova-operator-kog \
#           -n krateo-system -o jsonpath='{.status.apiVersion}')
#   [ -n "$API" ] || { echo "Ready but .status.apiVersion is empty"; exit 1; }
#   sed "s|composition.krateo.io/<APIVERSION>|$API|" \
#     examples/nova-composition/composition.yaml | kubectl apply -f -
#
# The check on $API is kept even after the wait, because Ready is the overall
# reconcile condition and not a promise that status is populated. The two have
# been observed agreeing on a real fleet, but an observation is not a documented
# invariant, and this check costs one line.
# An empty apiVersion fails with the SAME `no matches for kind` as a wrong
# one, so an unguarded substitution reproduces the bug it avoids.
apiVersion: composition.krateo.io/<APIVERSION>   # substitute - see header
kind: OpenstackNovaOperatorKog
metadata:
  name: openstack-nova-operator-kog
  namespace: openstack
spec:
  nova:
    # The key user input: the region-specific Nova endpoint from your Keystone
    # service catalog. Replace <projectId> with your project id, and note the
    # region: an OVH openrc may say GRA9 while this example shows gra11.
    # `scripts/get-token.sh --upstream` prints the discovered url.
    #
    # This was `upstreamUrl`, with an `enabled: true` beside it. NEITHER FIELD
    # EXISTS: `upstreamUrl` was the nginx auth-bridge's upstream, and the bridge
    # was deleted when the OAS moved to a native apiKey scheme. The chart's
    # values.schema.json allows exactly one property here -- `url`, required --
    # so the old spec was rejected with
    #   strict decoding error: unknown field "spec.nova.upstreamUrl"
    # This example had never been applied, which is why it survived the rename.
    url: https://compute.gra11.cloud.ovh.net/v2.1/<projectId>
  restdefinitions:
    server:
      enabled: true
    flavor:
      enabled: true
    keypair:
      enabled: false
    server_group:
      enabled: false
    aggregate:
      enabled: false
    quota:
      enabled: false
