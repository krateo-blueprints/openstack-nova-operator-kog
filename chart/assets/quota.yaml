openapi: 3.0.3
info:
  title: OpenStack Compute (Nova) - Quota Sets (KOG-friendly subset)
  description: |
    Hand-crafted OpenAPI 3.0 subset of the Nova v2.1 Compute API covering the
    per-project Quota Set (get / set / reset). A quota set is a singleton per
    project: there is no create, you PUT to update and DELETE to reset to the
    defaults.

    Quota writes also require the **admin** role: `PUT /os-quota-sets/{tenant_id}`
    defaults to `rule:context_is_admin`, so a project user on a shared public
    cloud cannot set quotas even though the body shape below is now solved.
    This definition ships ENABLED as of the 0.52.0 pin, so that admin
    requirement is now the live constraint on it -- expect 403 on a public
    cloud with a project-scoped credential.

    SOLVED AS OF THE 0.52.0 PIN (was: KNOWN LIMITATION, shipped enabled:false).
    The update is `PUT /os-quota-sets/{tenant_id}` with a body of strictly
    `{quota_set:{...}}` (Nova sets `additionalProperties:false`). Serialisation
    follows the BODY SCHEMA, not the CR spec, so omitting `tenant_id` from
    `QuotaUpdateRequest` keeps it out of the body while the path parameter still
    supplies `spec.tenant_id` for the `{tenant_id}` segment. Measured on the
    wire against a request-logging stand-in:
      PUT /v2.1/p/os-quota-sets/proj-arm23
          body={"quota_set":{"cores":20,"instances":10,"ram":51200}}
    -- template substituted, tenant_id absent from the body. The KOG feature
    this once waited for turned out to be oasgen-provider#421, not an
    `excludedFromBody` mapping. The Kind is `ComputeQuota` (the `quota_set` envelope → `QuotaSet`
    field; `ComputeQuota` avoids the collision).
  version: "2.1"
servers:
  - url: {{ include "openstack-nova-operator-kog.novaUrl" . }}
    description: OpenStack Nova Compute API (Keystone service catalog endpoint)
components:
  securitySchemes:
    apiKey:
      # Nova authenticates with a Keystone token sent verbatim in X-Auth-Token.
      # oasgen-provider generates spec.authentication.apiKey.{tokenRef,header}
      # from this; no Authorization header and no proxy are involved.
      type: apiKey
      in: header
      name: X-Auth-Token
  schemas:
    QuotaSetSpec:
      type: object
      properties:
        instances:
          type: integer
        cores:
          type: integer
        ram:
          type: integer
        key_pairs:
          type: integer
        metadata_items:
          type: integer
        server_groups:
          type: integer
        server_group_members:
          type: integer
    QuotaUpdateRequest:
      type: object
      required:
        - quota_set
      properties:
        # tenant_id IS DELIBERATELY ABSENT, and it used to be here.
        # Nova sets additionalProperties:false on this body, so a tenant_id in
        # it returns 400. It was declared here anyway because before
        # oasgen-provider 0.52.0 the self-referential mapping
        # (inPath: tenant_id -> spec.tenant_id) made the generator DELETE the
        # spec property the mapping reads from -- oasgen-provider#419 -- and a
        # body declaration was the only thing that kept spec.tenant_id alive.
        # #421, first released in 0.52.0, exempts that shape, so the path
        # PARAMETER now creates the property instead. Measured, both ways:
        #   0.50.0, tenant_id removed  -> spec.tenant_id ABSENT, verbs unexecutable
        #   0.52.0, tenant_id removed  -> spec.tenant_id present AND required
        # THIS IS WHY 0.52.0 IS A HARD FLOOR, not a preference.
        quota_set:
          $ref: '#/components/schemas/QuotaSetSpec'
    QuotaEnvelope:
      type: object
      properties:
        quota_set:
          type: object
          additionalProperties: true
security:
  - apiKey: []
paths:
  /os-quota-sets/{tenant_id}:
    parameters:
      - name: tenant_id
        in: path
        required: true
        schema:
          type: string
        description: Project ID.
    put:
      operationId: setQuota
      summary: Update the quota set for a project
      tags: [quotas]
      security:
        - apiKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QuotaUpdateRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuotaEnvelope'
    get:
      operationId: getQuota
      summary: Show the quota set for a project
      tags: [quotas]
      security:
        - apiKey: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuotaEnvelope'
    delete:
      operationId: resetQuota
      summary: Reset the quota set to defaults
      tags: [quotas]
      security:
        - apiKey: []
      responses:
        '202':
          description: Accepted - quota reset
