openapi: 3.0.3
info:
  title: OpenStack Compute (Nova) - Servers (KOG-friendly subset)
  description: |
    Hand-crafted OpenAPI 3.0 subset of the Nova v2.1 Compute API covering
    the Server lifecycle (create / get / delete) sufficient for managing
    a compute instance through the Krateo Operator Generator (KOG).

    The OpenStack Nova API authenticates with Keystone-issued tokens
    delivered via the `X-Auth-Token` HTTP header, which this spec declares
    directly as an `apiKey` security scheme. oasgen-provider (0.52.0, or >= 0.54.1 -- NOT 0.53.0 or 0.54.0)
    generates `spec.authentication.apiKey.{tokenRef,header}` from it and
    rest-dynamic-controller sets the header itself, so the controller talks
    to Nova directly - there is no proxy in the request path.

    The Nova request/response payload wraps all server fields in a
    top-level `server` object; the OAS reflects that envelope honestly,
    so the generated CR uses `spec.server.name`, `spec.server.flavorRef`,
    etc.
  version: "2.1"
servers:
  - url: {{ include "openstack-nova-operator-kog.novaUrl" . }}
    description: OpenStack Nova Compute API (Keystone service catalog endpoint)
components:
  securitySchemes:
    apiKey:
      # Nova authenticates with a Keystone token sent verbatim in X-Auth-Token.
      # oasgen-provider generates spec.authentication.apiKey.{tokenRef,header}
      # from this; no Authorization header and no proxy are involved.
      type: apiKey
      in: header
      name: X-Auth-Token
  schemas:
    Network:
      type: object
      properties:
        uuid:
          type: string
          description: Neutron network UUID to attach to the instance.
    SecurityGroup:
      type: object
      properties:
        name:
          type: string
    ServerSpec:
      type: object
      # `imageRef` IS NO LONGER REQUIRED, and the CRD cannot express the real
      # rule. Nova accepts a server created EITHER from an image (`imageRef`)
      # OR from a bootable volume (`block_device_mapping_v2` with
      # `boot_index: 0`), and requires exactly one of them. "Exactly one of"
      # is a cross-field constraint, which in a CRD means
      # `x-kubernetes-validations` -- and that does NOT survive the generator.
      #
      # Measured 2026-11-19, both versions, because the mechanism differs:
      #   oasgen 0.52.0 (our pin)   Schema.Extensions has NO population site;
      #                             the only assignment in the tree is the
      #                             clone function copying an existing map
      #   oasgen 0.74.0 (installer) the adapter DOES populate it, but through a
      #                             closed two-key allowlist:
      #                             x-kubernetes-list-type and
      #                             x-kubernetes-list-map-keys. CEL is not on it
      #   control                   "x-kubernetes-validations" appears in 0
      #                             non-test files of oasgen 0.74.0, against 3
      #                             for "x-kubernetes-list-type"
      #
      # plumbing's crdgen WOULD carry a CEL rule (passthroughExtensions, from
      # v1.14.2), so the gate is oasgen's allowlist and not the generator. Told
      # upstream; one allowlist entry would change this.
      #
      # SO THE CONSEQUENCE IS DELIBERATE AND DOCUMENTED RATHER THAN HIDDEN:
      # supplying neither an imageRef nor a bootable block device is accepted by
      # `kubectl apply` and refused by Nova at reconcile, the same shape as the
      # keypair `type` 400 in docs/configuration.md. A looser schema that
      # pretended to validate it would be worse: it would move the error from a
      # vendor 400 with a readable message to a rule that is silently dropped.
      required:
        - name
        - flavorRef
      properties:
        name:
          type: string
          description: Human-readable server name.
        flavorRef:
          type: string
          description: Flavor ID (e.g. `b2-7`) or full flavor URL.
        imageRef:
          type: string
          description: Image UUID to boot from.
        key_name:
          type: string
          description: Name of an existing keypair to inject.
        networks:
          type: array
          items:
            $ref: '#/components/schemas/Network'
        security_groups:
          type: array
          items:
            $ref: '#/components/schemas/SecurityGroup'
        availability_zone:
          type: string
        user_data:
          type: string
          description: base64-encoded cloud-init payload.
        metadata:
          type: object
          additionalProperties:
            type: string
        config_drive:
          type: boolean
        block_device_mapping_v2:
          type: array
          description: >-
            Block devices to attach at boot. With `source_type: volume`,
            `destination_type: volume` and `boot_index: 0` this boots the server
            from an existing Cinder volume and `imageRef` is not needed.
          items:
            $ref: '#/components/schemas/BlockDeviceMappingV2'
    # EVERY FIELD HERE EXISTS AT MICROVERSION 2.1, which is what this chart
    # speaks: it sends no microversion header on any path, and Nova resolves a
    # header-less request to DEFAULT_API_VERSION, the API minimum. Two fields a
    # reader will reach for are DELIBERATELY ABSENT, because Nova would refuse
    # the whole body with `Additional properties are not allowed`:
    #
    #     tag          2.32    per-device tag
    #     volume_type  2.67    volume type for a created volume
    #
    # verify_no_request_field_above_microversion_baseline in scripts/validate.py
    # now enforces that, and it exists: keypair.yaml cited it before it was
    # written, which is how the gap was found.
    BlockDeviceMappingV2:
      type: object
      properties:
        source_type:
          type: string
          description: Where the device comes from.
          enum: [blank, snapshot, image, volume]
        destination_type:
          type: string
          description: Whether the device is local to the hypervisor or a volume.
          enum: [local, volume]
        uuid:
          type: string
          description: >-
            ID of the image, snapshot or volume named by `source_type`. Omitted
            for `source_type: blank`.
        boot_index:
          type: integer
          # NULLABLE AND UNBOUNDED, BOTH DELIBERATE, AND BOTH FROM NOVA'S OWN
          # SOURCE RATHER THAN FROM THE API REFERENCE. At stable/2026.1,
          # nova/api/openstack/compute/schemas/servers.py declares:
          #
          #     # NOTE(mriedem): boot_index=None is also accepted for backward
          #     # compatibility with the legacy v2 API.
          #     'boot_index': {
          #         'type': ['integer', 'string', 'null'],
          #         'pattern': '^-?[0-9]+$',
          #     },
          #
          # Three things follow, each a trap for a later edit:
          #
          #   NO `minimum`.    The pattern admits a leading `-`, and `-1` means
          #                    "never boot from this device". A `minimum: 0`
          #                    added as an obvious tightening would reject a
          #                    value Nova documents, at `kubectl apply`, before
          #                    the request is ever made.
          #                    verify_boot_index_has_no_lower_bound in
          #                    scripts/validate.py refuses that edit.
          #   `nullable: true` Nova accepts null and says why. Verified to
          #                    survive both conversion stages rather than
          #                    assumed: the oasgen adapter assigns Nullable,
          #                    schemaToMap emits `nullable`, crdgen's model
          #                    parses it and transpile copies it onto the CRD --
          #                    unlike x-kubernetes-validations, which has no
          #                    population site at all.
          #   STRING FORM NOT  This schema does not accept `"0"`. OAS 3.0.3
          #   EXPRESSED.       cannot express integer-or-string without a
          #                    junctor, and this repo has a standing note about
          #                    how the plumbing handles those. Integer is the
          #                    canonical form; a string boot_index would have to
          #                    be asked for.
          nullable: true
          description: >-
            Position in the boot order. `0` makes this the boot device, `-1`
            marks a device that must never be booted from, and `null` is
            accepted by Nova for legacy-API compatibility. No lower bound: read
            the comment above before adding one.
        delete_on_termination:
          type: boolean
          description: Delete the volume when the server is deleted.
        volume_size:
          type: integer
          description: Size in GiB, for a device Nova creates rather than attaches.
        device_name:
          type: string
          description: Guest device name, e.g. `vda`. Nova assigns one if omitted.
    ServerCreateRequest:
      type: object
      required:
        - server
      properties:
        server:
          $ref: '#/components/schemas/ServerSpec'
    ServerSummary:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        status:
          type: string
        OS-EXT-STS:vm_state:
          type: string
        OS-EXT-STS:power_state:
          type: integer
        OS-EXT-AZ:availability_zone:
          type: string
        accessIPv4:
          type: string
        accessIPv6:
          type: string
        tenant_id:
          type: string
        user_id:
          type: string
        flavor:
          type: object
          properties:
            id:
              type: string
        image:
          type: object
          properties:
            id:
              type: string
        addresses:
          type: object
          additionalProperties:
            type: array
            items:
              type: object
              properties:
                addr:
                  type: string
                version:
                  type: integer
        created:
          type: string
        updated:
          type: string
    ServerCreateResponse:
      type: object
      properties:
        server:
          $ref: '#/components/schemas/ServerSummary'
    ServerGetResponse:
      type: object
      properties:
        server:
          $ref: '#/components/schemas/ServerSummary'
security:
  - apiKey: []
paths:
  /servers:
    post:
      operationId: createServer
      summary: Create a server
      description: Boots a new compute instance on the project.
      tags: [servers]
      security:
        - apiKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ServerCreateRequest'
      responses:
        '202':
          description: Accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServerCreateResponse'
  /servers/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
        description: Server UUID.
    get:
      operationId: getServer
      summary: Show server details
      tags: [servers]
      security:
        - apiKey: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServerGetResponse'
    delete:
      operationId: deleteServer
      summary: Delete a server
      tags: [servers]
      security:
        - apiKey: []
      responses:
        '204':
          description: Accepted - server scheduled for deletion
