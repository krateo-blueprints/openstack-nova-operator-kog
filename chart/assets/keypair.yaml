openapi: 3.0.3
info:
  title: OpenStack Compute (Nova) - Keypairs (KOG-friendly subset)
  description: |
    Hand-crafted OpenAPI 3.0 subset of the Nova v2.1 Compute API covering the
    Keypair lifecycle (create / get / delete). Keypairs are keyed by `name`
    (there is no separate id). If `public_key` is omitted Nova generates a
    keypair and returns the private key in the create response only.

    Nova wraps the payload in a `keypair` envelope, so the CR uses
    `spec.keypair.*`. The CRD Kind is `ComputeKeypair` to avoid colliding with
    the `keypair` property crdgen derives from the envelope.
  version: "2.1"
servers:
  - url: {{ include "openstack-nova-operator-kog.novaUrl" . }}
    description: OpenStack Nova Compute API (Keystone service catalog endpoint)
components:
  securitySchemes:
    apiKey:
      # Nova authenticates with a Keystone token sent verbatim in X-Auth-Token.
      # oasgen-provider generates spec.authentication.apiKey.{tokenRef,header}
      # from this; no Authorization header and no proxy are involved.
      type: apiKey
      in: header
      name: X-Auth-Token
  schemas:
    KeypairSpec:
      type: object
      required:
        - name
      properties:
        name:
          type: string
          description: Keypair name (unique per project).
        public_key:
          type: string
          description: Existing SSH public key to import; omit to have Nova generate one.
        # `type` IS DELIBERATELY ABSENT FROM THIS REQUEST SCHEMA, and its removal
        # is a measured bug fix rather than a simplification.
        #
        # MEASURED 2026-11-18 against real Nova (dp303, the openstack-as-a-service
        # session's live run). The CR set `type: ssh`, rest-dynamic-controller
        # POSTed `{"keypair":{"name":...,"public_key":"ssh-rsa ...","type":"ssh"}}`,
        # and Nova answered:
        #
        #     HTTP/1.1 400
        #     X-Openstack-Nova-Api-Version: 2.1
        #     Invalid input for field/attribute keypair ...
        #     Additional properties are not allowed ('type' was unexpected)
        #
        # `type` exists on keypair create only from compute microversion 2.2, and
        # THIS CHART SENDS NO MICROVERSION HEADER ON ANY PATH, so Nova serves 2.1
        # and refuses the body. The CR stayed Ready=False/Creating and
        # Synced=False/ReconcileError indefinitely -- a field the CRD accepted and
        # the API version we speak cannot.
        #
        # Nova's own 400, carrying the version it served, is the evidence. The 2.1
        # baseline is deliberate (Diego, 2026-11-10); so this schema now matches
        # the baseline instead of contradicting it. Raising the baseline is a
        # separate decision, and `verify_no_request_field_above_microversion_baseline`
        # in scripts/validate.py is what keeps the next such field out.
    KeypairCreateRequest:
      type: object
      required:
        - keypair
      properties:
        keypair:
          $ref: '#/components/schemas/KeypairSpec'
    KeypairSummary:
      type: object
      properties:
        name:
          type: string
        fingerprint:
          type: string
        public_key:
          type: string
        type:
          type: string
          # RESPONSE-ONLY, AND NEVER POPULATED AT THIS CHART'S BASELINE. Nova
          # returns `type` on a keypair only from microversion 2.2 and this chart
          # sends no microversion header, so `.status.keypair.type` is empty on
          # every CR. It is kept, annotated, rather than deleted: a declared
          # field the vendor omits is skipped silently by populateStatusFields --
          # no error, no event, no log -- so the honest record is the annotation,
          # not an absence that looks like an oversight.
          x-nova-microversion: "2.2"
        user_id:
          type: string
    KeypairEnvelope:
      type: object
      properties:
        keypair:
          $ref: '#/components/schemas/KeypairSummary'
security:
  - apiKey: []
paths:
  /os-keypairs:
    post:
      operationId: createKeypair
      summary: Create or import a keypair
      tags: [keypairs]
      security:
        - apiKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/KeypairCreateRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KeypairEnvelope'
  /os-keypairs/{name}:
    parameters:
      - name: name
        in: path
        required: true
        schema:
          type: string
        description: Keypair name.
    get:
      operationId: getKeypair
      summary: Show keypair details
      tags: [keypairs]
      security:
        - apiKey: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KeypairEnvelope'
        # DECLARED FOR EXPLICITNESS, NOT AS A FIX, and the distinction is the
        # point. Nothing in the pipeline reads this: rest-dynamic-controller
        # decides absence from the HTTP STATUS in code --
        # `IsNotFoundError(err) { return HasStatusErr(err, http.StatusNotFound) }`
        # in its `validators.go`, byte-identical at 0.80.0 and 0.82.0 -- and the
        # generator's success set defaults to {200, 201}, so a 404 is not
        # extracted either. Declaring it changes no behaviour on either path.
        #
        # It is here because this kind's correctness DEPENDS on Nova returning
        # 404 for a missing keypair, and that dependency was previously
        # load-bearing by accident: nowhere in the document said the get could
        # answer "absent". Unlike `ComputeQuota`, whose get has no existence
        # check at all and therefore needed a verb rather than a declaration
        # (see templates/rd-quota.yaml), this one works -- and now says why.
        #
        # DO NOT CONCLUDE FROM THIS LINE that an OAS 404 declaration drives
        # existence detection. It does not. Raised by the
        # openstack-as-a-service session, which found it with a static screen
        # that treated a declared 404 as evidence; they are removing that pass
        # for the same reason this comment exists.
        # NO `content`, deliberately: there is no NotFound schema in this
        # document and inventing one would add surface for a body nothing reads.
        # The status code is the whole content of this declaration.
        '404':
          description: |
            Keypair not found. Nova returns this for a name that does not exist,
            which is what makes the create path reachable for this kind.
    delete:
      operationId: deleteKeypair
      summary: Delete a keypair
      tags: [keypairs]
      security:
        - apiKey: []
      responses:
        '202':
          description: Accepted - keypair deleted
