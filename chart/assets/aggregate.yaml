openapi: 3.0.3
info:
  title: OpenStack Compute (Nova) - Host Aggregates (KOG-friendly subset)
  description: |
    Hand-crafted OpenAPI 3.0 subset of the Nova v2.1 Compute API covering the
    host Aggregate lifecycle (create / get / delete). Aggregates group compute
    hosts (optionally into an availability zone). Adding hosts/metadata uses
    separate actions and is out of scope for this subset.

    Nova wraps the payload in an `aggregate` envelope, so the CR uses
    `spec.aggregate.*`. The CRD Kind is `ComputeAggregate` to avoid colliding
    with the `aggregate` property crdgen derives from the envelope. Aggregate
    operations require the admin role.
  version: "2.1"
servers:
  - url: {{ include "openstack-nova-operator-kog.novaUrl" . }}
    description: OpenStack Nova Compute API (Keystone service catalog endpoint)
components:
  securitySchemes:
    apiKey:
      # Nova authenticates with a Keystone token sent verbatim in X-Auth-Token.
      # oasgen-provider generates spec.authentication.apiKey.{tokenRef,header}
      # from this; no Authorization header and no proxy are involved.
      type: apiKey
      in: header
      name: X-Auth-Token
  schemas:
    AggregateSpec:
      type: object
      required:
        - name
      properties:
        name:
          type: string
          description: Aggregate name.
        availability_zone:
          type: string
          description: Availability zone this aggregate maps to (optional).
    AggregateCreateRequest:
      type: object
      required:
        - aggregate
      properties:
        aggregate:
          $ref: '#/components/schemas/AggregateSpec'
    AggregateSummary:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        availability_zone:
          type: string
        hosts:
          type: array
          items:
            type: string
        metadata:
          type: object
          additionalProperties:
            type: string
        created_at:
          type: string
    AggregateEnvelope:
      type: object
      properties:
        aggregate:
          $ref: '#/components/schemas/AggregateSummary'
    AggregateCreateResponse:
      # POST /os-aggregates DOES NOT RETURN hosts OR metadata, and Nova removes
      # them by hand rather than by omission. nova/api/openstack/compute/
      # aggregates.py, create(), at stable/2026.1:
      #
      #     agg = self._marshall_aggregate(req, aggregate)
      #     # To maintain the backwards compatibility, we need to remove the
      #     # hosts and metadata from the response
      #     del agg['aggregate']['hosts']
      #     del agg['aggregate']['metadata']
      #
      # `show` keeps both -- its own docstring says "hosts and metadata
      # included" -- so the two endpoints genuinely differ and one schema
      # cannot describe both. This mirrors server.yaml, which already splits
      # ServerCreateResponse from ServerGetResponse for the same reason.
      #
      # WHY IT MATTERS EVEN THOUGH IT IS INERT TODAY. aggregate.hosts is an
      # additionalStatusField; after a create it is simply skipped (no error, no
      # event, no log) and the following Observe populates it from the GET. But
      # hack/check-restdefinition-shape.py counts the CREATE RESPONSE as a valid
      # source for check B, so a shared envelope makes the screen optimistic
      # exactly where it trusts the document. Both aggregate identifiers are
      # really in the create response, so nothing is wrong now -- that is luck,
      # not design, and this split is what makes it design.
      #
      # Found because openstack-ironic-operator-kog measured the same class in
      # all six of their documents: one schema reused for two endpoints that
      # return different shapes, with the RestDefinition agreeing with the OAS
      # and both wrong about the vendor.
      type: object
      properties:
        aggregate:
          type: object
          properties:
            id:
              type: integer
            name:
              type: string
            availability_zone:
              type: string
            created_at:
              type: string
security:
  - apiKey: []
paths:
  /os-aggregates:
    post:
      operationId: createAggregate
      summary: Create a host aggregate
      tags: [aggregates]
      security:
        - apiKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AggregateCreateRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AggregateCreateResponse'
  /os-aggregates/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
        description: Aggregate ID (integer).
    get:
      operationId: getAggregate
      summary: Show aggregate details
      tags: [aggregates]
      security:
        - apiKey: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AggregateEnvelope'
    delete:
      operationId: deleteAggregate
      summary: Delete a host aggregate
      tags: [aggregates]
      security:
        - apiKey: []
      responses:
        '200':
          description: OK - aggregate deleted
