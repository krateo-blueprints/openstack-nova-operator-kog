# InstanceConfiguration is auto-generated by oasgen-provider as a
# side-effect of the RestDefinition: because the OAS declares an
# `apiKey` (in: header, name: X-Auth-Token) security scheme, the generated
# <Kind>Configuration CRD carries the authentication block. The Instance CR references this
# Configuration via spec.configurationRef.
#
# This file intentionally does NOT define the `nova-token` Secret. In
# production that Secret belongs to a SECRET-MANAGER (External Secrets
# Operator, Vault Agent, ...) which mints and rotates the Keystone token;
# this chart ships no refresh logic of its own. For a local demo you can
# bootstrap it by hand:
#
#   ./scripts/get-token.sh --secret | kubectl apply -f -
#
# Keeping the Secret in a single source avoids accidentally overwriting
# a freshly fetched token with a stale placeholder. If you prefer to set
# it by hand:
#
#   kubectl -n krateo-system create secret generic nova-token \
#     --from-literal=token="<keystone-token>"
apiVersion: nova.openstack.krateo.io/v1alpha1
kind: InstanceConfiguration
metadata:
  name: nova-config
  namespace: krateo-system
spec:
  authentication:
    apiKey:
      # The Secret holds the RAW Keystone token value - no prefix, no
      # "Bearer ". A secret-manager (ESO, Vault Agent, ...) owns minting
      # and rotating it; nothing in this chart refreshes it.
      tokenRef:
        name: nova-token
        namespace: krateo-system
        key: token
      # The header Nova expects. oasgen-provider defaults this from the
      # OAS scheme name, but it is a real field so the derived value is
      # visible when you are debugging a 401.
      header: X-Auth-Token
