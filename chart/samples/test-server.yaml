# ---------------------------------------------------------------------------
# KNOWN BLOCKED UPSTREAM: oasgen-provider#325 (as of 2026-10-30, through 0.42.0)
#
# Applying the RESOURCE CRs below currently fails:
#
#     ComputeFlavor "m1-small" is invalid: spec.id: Required value
#
# oasgen adds a REQUIRED top-level `spec.<pathParam>` for every path parameter
# ({id} -> spec.id, {name} -> spec.name) and ignores the `requestFieldMapping`
# that says where the value actually comes from. Four of this chart's five
# resources map that parameter from `status.*`, because Nova mints the id at
# create and the controller reads it back for get/delete -- so the field cannot
# be satisfied at create time and the create path is blocked.
#
# These samples are NOT wrong and are deliberately left unpatched. Adding a
# placeholder `id:` would make them apply while meaning nothing: you cannot hand
# Nova an identifier it has not minted. A sample that passes CI by carrying a
# fabricated value is worse than one that fails honestly.
#
# Upstream confirmed the suppression is intended -- `spec_builder.go` already
# does exactly this for resolver-supplied BODY fields (#246: "a body field a
# RESOLVER supplies must not be required of the user") and the rule was never
# extended to mapping-supplied PARAMETERS. No change is needed in this repo.
# ---------------------------------------------------------------------------
# Example Instance CR. Adjust flavorRef / imageRef / network UUID for
# your OVH Public Cloud project. List flavors and images with:
#   openstack flavor list
#   openstack image  list
#   openstack network list
#
# The Kind is `Instance` (NOT `Server`): the Nova request body wraps
# everything in a `{ "server": {...} }` envelope, so the generated spec
# has a property named `server`. A Kind named `Server` collides with it
# in crdgen and yields an invalid CRD, so the chart names the Kind
# `Instance` (configurable via restdefinitions.server.resourceKind).
apiVersion: nova.openstack.krateo.io/v2-1
kind: Instance
metadata:
  name: kog-demo-1
  namespace: krateo-system
  annotations:
    # Dumps the full request/response to the controller log. Useful when
    # debugging, but REQUIRES oasgen-provider >= 0.26.1: before that the
    # verbose dump redacted only values it had been told were sensitive,
    # so credential HEADERS were written in cleartext - and this chart's
    # credential IS a header (X-Auth-Token). Since 0.26.1 credential
    # headers are redacted by name. Leave this off in production.
    krateo.io/connector-verbose: "true"
spec:
  # Points at the InstanceConfiguration that holds the Keystone token
  # (see chart/samples/nova-auth.yaml).
  configurationRef:
    name: nova-config
    namespace: krateo-system
  server:
    name: kog-demo-1
    # b2-7 = 2 vCPU / 7GB RAM (OVH GRA region naming)
    flavorRef: "b2-7"
    # Replace with a real Image UUID from `openstack image list`
    imageRef: "00000000-0000-0000-0000-000000000000"
    networks:
      # Replace with a real Network UUID from `openstack network list`.
      # On OVH the public network is named "Ext-Net".
      - uuid: "00000000-0000-0000-0000-000000000000"
    # security_groups:
    #   - name: default
    # key_name: my-keypair
    # availability_zone: nova
    # config_drive: true
    # user_data: I2Nsb3VkLWNvbmZpZwo=    # base64(cloud-init)
    metadata:
      managed-by: krateo-kog
