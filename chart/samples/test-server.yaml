# ---------------------------------------------------------------------------
# WHY THERE IS NO `spec.id` HERE, and why adding one would be wrong.
#
# oasgen omits a path parameter from the generated spec when a verb supplies it
# with a request-direction `requestFieldMapping`. Four of this chart's kinds map
# {id} from `status.*`, because Nova mints the id at create and the controller
# reads it back for get/delete -- so `spec.id` is absent BY DESIGN and these
# samples are complete as written. Adding a placeholder would hand Nova an
# identifier it never minted, and a sample that passes CI carrying a fabricated
# value is worse than one that fails honestly.
#
# THIS BANNER USED TO SAY THE OPPOSITE: that applying the resource CRs below
# failed with `spec.id: Required value`, blocked upstream on oasgen-provider#325,
# and that no change was needed here. That was true through 0.42.0. #325 closed
# on 2026-10-30, the fix shipped in 0.43.0, and this chart has pinned 0.52.0
# since -- so the claim was stale in every release anyone could have read it in,
# while `docs/configuration.md` recorded the fix on the same branch.
#
# Measured 2026-11-17: all four sample files pass `kubectl apply
# --dry-run=server`. On 0.52.0 that is asserted by the smoke job on every run;
# on 0.80.0 it was run by hand, where the generator reports the omission as a
# `status.schemaWarnings` notice rather than an error.
# ---------------------------------------------------------------------------
# Example Instance CR. Adjust flavorRef / imageRef / network UUID for
# your OVH Public Cloud project. List flavors and images with:
#   openstack flavor list
#   openstack image  list
#   openstack network list
#
# The Kind is `Instance` (NOT `Server`): the Nova request body wraps
# everything in a `{ "server": {...} }` envelope, so the generated spec
# has a property named `server`. A Kind named `Server` collides with it
# in crdgen and yields an invalid CRD, so the chart names the Kind
# `Instance` (configurable via restdefinitions.server.resourceKind).
apiVersion: nova.openstack.krateo.io/v2-1
kind: Instance
metadata:
  name: kog-demo-1
  namespace: krateo-system
  annotations:
    # Dumps the full request/response to the controller log. Useful when
    # debugging, but REQUIRES oasgen-provider >= 0.26.1: before that the
    # verbose dump redacted only values it had been told were sensitive,
    # so credential HEADERS were written in cleartext - and this chart's
    # credential IS a header (X-Auth-Token). Since 0.26.1 credential
    # headers are redacted by name. Leave this off in production.
    krateo.io/connector-verbose: "true"
spec:
  # Points at the InstanceConfiguration that holds the Keystone token
  # (see chart/samples/nova-auth.yaml).
  configurationRef:
    name: nova-config
    namespace: krateo-system
  server:
    name: kog-demo-1
    # b2-7 = 2 vCPU / 7GB RAM (OVH GRA region naming)
    flavorRef: "b2-7"
    # Replace with a real Image UUID from `openstack image list`
    imageRef: "00000000-0000-0000-0000-000000000000"
    networks:
      # Replace with a real Network UUID from `openstack network list`.
      # On OVH the public network is named "Ext-Net".
      - uuid: "00000000-0000-0000-0000-000000000000"
    # security_groups:
    #   - name: default
    # key_name: my-keypair
    # availability_zone: nova
    # config_drive: true
    # user_data: I2Nsb3VkLWNvbmZpZwo=    # base64(cloud-init)
    metadata:
      managed-by: krateo-kog
