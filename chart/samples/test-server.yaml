# Example Instance CR. Adjust flavorRef / imageRef / network UUID for
# your OVH Public Cloud project. List flavors and images with:
#   openstack flavor list
#   openstack image  list
#   openstack network list
#
# The Kind is `Instance` (NOT `Server`): the Nova request body wraps
# everything in a `{ "server": {...} }` envelope, so the generated spec
# has a property named `server`. A Kind named `Server` collides with it
# in crdgen and yields an invalid CRD, so the chart names the Kind
# `Instance` (configurable via restdefinitions.server.resourceKind).
apiVersion: nova.openstack.krateo.io/v1alpha1
kind: Instance
metadata:
  name: kog-demo-1
  namespace: krateo-system
  annotations:
    # Dumps the full request/response to the controller log. Useful when
    # debugging, but REQUIRES oasgen-provider >= 0.26.1: before that the
    # verbose dump redacted only values it had been told were sensitive,
    # so credential HEADERS were written in cleartext - and this chart's
    # credential IS a header (X-Auth-Token). Since 0.26.1 credential
    # headers are redacted by name. Leave this off in production.
    krateo.io/connector-verbose: "true"
spec:
  # Points at the InstanceConfiguration that holds the bearer token
  # (see chart/samples/nova-auth.yaml).
  configurationRef:
    name: nova-config
    namespace: krateo-system
  server:
    name: kog-demo-1
    # b2-7 = 2 vCPU / 7GB RAM (OVH GRA region naming)
    flavorRef: "b2-7"
    # Replace with a real Image UUID from `openstack image list`
    imageRef: "00000000-0000-0000-0000-000000000000"
    networks:
      # Replace with a real Network UUID from `openstack network list`.
      # On OVH the public network is named "Ext-Net".
      - uuid: "00000000-0000-0000-0000-000000000000"
    # security_groups:
    #   - name: default
    # key_name: my-keypair
    # availability_zone: nova
    # config_drive: true
    # user_data: I2Nsb3VkLWNvbmZpZwo=    # base64(cloud-init)
    metadata:
      managed-by: krateo-kog
