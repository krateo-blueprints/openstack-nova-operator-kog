# ---------------------------------------------------------------------------
# KNOWN BLOCKED UPSTREAM: oasgen-provider#325 (as of 2026-10-30, through 0.42.0)
#
# Applying the RESOURCE CRs below currently fails:
#
#     ComputeFlavor "m1-small" is invalid: spec.id: Required value
#
# oasgen adds a REQUIRED top-level `spec.<pathParam>` for every path parameter
# ({id} -> spec.id, {name} -> spec.name) and ignores the `requestFieldMapping`
# that says where the value actually comes from. Four of this chart's five
# resources map that parameter from `status.*`, because Nova mints the id at
# create and the controller reads it back for get/delete -- so the field cannot
# be satisfied at create time and the create path is blocked.
#
# These samples are NOT wrong and are deliberately left unpatched. Adding a
# placeholder `id:` would make them apply while meaning nothing: you cannot hand
# Nova an identifier it has not minted. A sample that passes CI by carrying a
# fabricated value is worse than one that fails honestly.
#
# Upstream confirmed the suppression is intended -- `spec_builder.go` already
# does exactly this for resolver-supplied BODY fields (#246: "a body field a
# RESOLVER supplies must not be required of the user") and the rule was never
# extended to mapping-supplied PARAMETERS. No change is needed in this repo.
# ---------------------------------------------------------------------------
# Sample CRs for the additional Nova resources this chart now manages.
# Each Kind references a per-Kind <Kind>Configuration that carries the Keystone
# token (generated by oasgen-provider from the OAS `apiKey` security scheme);
# reuse the nova-token Secret pattern from samples/nova-auth.yaml.
#
# The Kinds are prefixed (ComputeFlavor / ComputeKeypair / ComputeServerGroup /
# ComputeAggregate) because each Nova payload is envelope-wrapped (flavor /
# keypair / server_group / aggregate); an un-prefixed Kind would collide with
# the envelope property in crdgen (same reason Server -> Instance).
---
apiVersion: nova.openstack.krateo.io/v1alpha1
kind: ComputeFlavorConfiguration
metadata:
  name: nova-config
  namespace: krateo-system
spec:
  authentication:
    apiKey:
      tokenRef: { name: nova-token, namespace: krateo-system, key: token }
      header: X-Auth-Token
---
apiVersion: nova.openstack.krateo.io/v2-1
kind: ComputeFlavor
metadata:
  name: m1-small
  namespace: krateo-system
spec:
  configurationRef: { name: nova-config, namespace: krateo-system }
  flavor:
    name: m1.small
    ram: 2048
    vcpus: 1
    disk: 20
---
apiVersion: nova.openstack.krateo.io/v2-1
kind: ComputeKeypair
metadata:
  name: my-key
  namespace: krateo-system
spec:
  # configurationRef -> a ComputeKeypairConfiguration (same token Secret).
  configurationRef: { name: nova-config-keypair, namespace: krateo-system }
  keypair:
    name: my-key
    # Omit public_key to have Nova generate one (private key returned only on create),
    # or import an existing key:
    # public_key: "ssh-ed25519 AAAA... user@host"
---
apiVersion: nova.openstack.krateo.io/v2-1
kind: ComputeServerGroup
metadata:
  name: web-anti-affinity
  namespace: krateo-system
spec:
  configurationRef: { name: nova-config-server-group, namespace: krateo-system }
  server_group:
    name: web-anti-affinity
    policies:
      - anti-affinity
---
apiVersion: nova.openstack.krateo.io/v2-1
kind: ComputeAggregate
metadata:
  name: ssd-hosts
  namespace: krateo-system
spec:
  # Aggregate operations require the admin role.
  configurationRef: { name: nova-config-aggregate, namespace: krateo-system }
  aggregate:
    name: ssd-hosts
    availability_zone: nova
