# ---------------------------------------------------------------------------
# WHY THERE IS NO `spec.id` HERE, and why adding one would be wrong.
#
# oasgen omits a path parameter from the generated spec when a verb supplies it
# with a request-direction `requestFieldMapping`. Four of this chart's kinds map
# {id} from `status.*`, because Nova mints the id at create and the controller
# reads it back for get/delete -- so `spec.id` is absent BY DESIGN and these
# samples are complete as written. Adding a placeholder would hand Nova an
# identifier it never minted, and a sample that passes CI carrying a fabricated
# value is worse than one that fails honestly.
#
# THIS BANNER USED TO SAY THE OPPOSITE: that applying the resource CRs below
# failed with `spec.id: Required value`, blocked upstream on oasgen-provider#325,
# and that no change was needed here. That was true through 0.42.0. #325 closed
# on 2026-10-30, the fix shipped in 0.43.0, and this chart has pinned 0.52.0
# since -- so the claim was stale in every release anyone could have read it in,
# while `docs/configuration.md` recorded the fix on the same branch.
#
# Measured 2026-11-17: all four sample files pass `kubectl apply
# --dry-run=server`. On 0.52.0 that is asserted by the smoke job on every run;
# on 0.80.0 it was run by hand, where the generator reports the omission as a
# `status.schemaWarnings` notice rather than an error.
# ---------------------------------------------------------------------------
# Sample CRs for the additional Nova resources this chart now manages.
# Each Kind references a per-Kind <Kind>Configuration that carries the Keystone
# token (generated by oasgen-provider from the OAS `apiKey` security scheme);
# reuse the nova-token Secret pattern from samples/nova-auth.yaml.
#
# The Kinds are prefixed (ComputeFlavor / ComputeKeypair / ComputeServerGroup /
# ComputeAggregate) because each Nova payload is envelope-wrapped (flavor /
# keypair / server_group / aggregate); an un-prefixed Kind would collide with
# the envelope property in crdgen (same reason Server -> Instance).
---
apiVersion: nova.openstack.krateo.io/v1alpha1
kind: ComputeFlavorConfiguration
metadata:
  name: nova-config
  namespace: krateo-system
spec:
  authentication:
    apiKey:
      tokenRef: { name: nova-token, namespace: krateo-system, key: token }
      header: X-Auth-Token
---
apiVersion: nova.openstack.krateo.io/v2-1
kind: ComputeFlavor
metadata:
  name: m1-small
  namespace: krateo-system
spec:
  configurationRef: { name: nova-config, namespace: krateo-system }
  flavor:
    name: m1.small
    ram: 2048
    vcpus: 1
    disk: 20
---
apiVersion: nova.openstack.krateo.io/v2-1
kind: ComputeKeypair
metadata:
  name: my-key
  namespace: krateo-system
spec:
  # configurationRef -> a ComputeKeypairConfiguration (same token Secret).
  configurationRef: { name: nova-config-keypair, namespace: krateo-system }
  keypair:
    name: my-key
    # Omit public_key to have Nova generate one (private key returned only on create),
    # or import an existing key:
    # public_key: "ssh-ed25519 AAAA... user@host"
---
apiVersion: nova.openstack.krateo.io/v2-1
kind: ComputeServerGroup
metadata:
  name: web-anti-affinity
  namespace: krateo-system
spec:
  configurationRef: { name: nova-config-server-group, namespace: krateo-system }
  server_group:
    name: web-anti-affinity
    policies:
      - anti-affinity
---
apiVersion: nova.openstack.krateo.io/v2-1
kind: ComputeAggregate
metadata:
  name: ssd-hosts
  namespace: krateo-system
spec:
  # Aggregate operations require the admin role.
  configurationRef: { name: nova-config-aggregate, namespace: krateo-system }
  aggregate:
    name: ssd-hosts
    availability_zone: nova
