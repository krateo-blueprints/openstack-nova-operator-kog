{{- if .Values.restdefinitions.quota.enabled }}
apiVersion: ogen.krateo.io/v1alpha1
kind: RestDefinition
metadata:
  name: {{ .Release.Name }}-quota
  labels:
    {{- include "openstack-nova-operator-kog.labels" . | nindent 4 }}
spec:
  oasPath: configmap://{{ .Release.Namespace }}/{{ .Release.Name }}-quota/quota.yaml
  resourceGroup: {{ .Values.restdefinitions.quota.resourceGroup }}
  resource:
    # Quota set is a per-project singleton: PUT to set, DELETE to reset.
    #
    # THIS DEFINITION WAS DISABLED FROM THE DAY IT WAS WRITTEN AND IS NOW
    # ENABLED. It needed oasgen-provider 0.52.0, and the history is kept here
    # because the fix is a DELETION and deletions lose their reason fastest.
    #
    # All three verbs below map `inPath: tenant_id` -> `spec.tenant_id`. That
    # self-reference is the shape in which oasgen-provider#419's suppression
    # deleted the very property the mapping reads from, leaving the verb
    # unexecutable against the literal `{tenant_id}` template. For as long as
    # that bug existed, `tenant_id` ALSO had to be declared in
    # `QuotaUpdateRequest` in assets/quota.yaml, purely to keep the spec
    # property alive -- and Nova sets `additionalProperties:false` on that body,
    # so the declaration that saved the property is exactly what made the PUT
    # return 400. The resource could not be both generated and callable.
    #
    # #421, first released in 0.52.0, exempts a self-referential mapping, so the
    # path PARAMETER creates the property instead. MEASURED BOTH WAYS on the
    # same document, from the CRD as the API server serves it:
    #
    #   0.50.0, tenant_id in the body     -> spec.tenant_id present, required
    #   0.50.0, tenant_id removed         -> spec.tenant_id ABSENT
    #                                        (resourceVersion 680 -> 1647, so
    #                                        it really did regenerate)
    #   0.52.0, tenant_id removed         -> spec.tenant_id PRESENT and in
    #                                        spec.required; quota_set 7 children
    #                                        as the positive control
    #
    # And ON THE WIRE, against a request-logging stand-in for Nova:
    #
    #   PUT /v2.1/p/os-quota-sets/proj-arm23
    #       body={"quota_set":{"cores":20,"instances":10,"ram":51200}}
    #
    # -- the {tenant_id} template SUBSTITUTED rather than left literal, and
    # tenant_id ABSENT from the body. The CR reached Ready=True/Available.
    #
    # SO 0.52.0 IS A HARD FLOOR FOR THIS CHART WHILE THIS RESOURCE IS ENABLED.
    # On 0.50.0 this definition generates three verbs that read a property that
    # does not exist. If you must run an older oasgen-provider, set
    # `restdefinitions.quota.enabled: false` -- do NOT "fix" it by putting
    # `tenant_id` back in `QuotaUpdateRequest`, because that reintroduces the
    # 400 from Nova.
    #
    # `tenant_id` has a SECOND consumer besides the three mappings: it is this
    # resource's `identifiers` entry below. Note it is bare where every other
    # kind here is dotted (`flavor.id`, `server.id`), because those payloads are
    # enveloped and the quota set is not. So the field is named twice for two
    # different reasons, and a cleanup that satisfies one can still break the
    # other.
    #
    # THE IDENTIFIER RESOLVES WITHOUT APPEARING IN ANY RESPONSE, which is worth
    # stating because it is not a general property of identifiers. This document
    # declares its GET response as `QuotaEnvelope` -- `{quota_set: ...}` and
    # nothing else -- so `tenant_id` appears in no response anywhere, and the
    # bare `identifiers: [tenant_id]` still resolved. That works because this
    # kind is ADDRESSABLE BY IDENTIFIER: it declares a `get` verb, and Observe
    # substitutes `spec.tenant_id` into the path instead of matching a response.
    # A `findby`-only kind is different -- there the identifier IS compared
    # against the response item, and one missing from the payload yields no
    # match. Do not read this note as "identifiers need not appear in responses".
    #
    # EVERY RUN ABOVE NEEDED A CONTROL CHOSEN AGAINST THE DIRECTION THE ANSWER
    # WAS EXPECTED TO FALL. Where absence was the FINDING, a CRD that was never
    # generated would have printed the finding rather than nothing -- guarded by
    # requiring `quota_set` and its children, which come from the same body
    # schema by the same generation path. Where absence was the PREDICTION, a
    # regeneration that silently did not happen would have confirmed it --
    # guarded by asserting the CRD's resourceVersion actually changed. Same
    # instrument, opposite guards, because what makes a result vacuous is which
    # way you expect it.
    #
    # ComputeQuota writes are Nova ADMIN-ONLY (`rule:context_is_admin`). On a
    # public cloud with a project-scoped credential these 403, which is Nova
    # policy and not a defect here.
    kind: {{ .Values.restdefinitions.quota.resourceKind }}
    identifiers:
      - tenant_id
    verbsDescription:
      - action: create
        method: PUT
        path: /os-quota-sets/{tenant_id}
        requestFieldMapping:
          - inPath: tenant_id
            inCustomResource: spec.tenant_id
      - action: get
        method: GET
        path: /os-quota-sets/{tenant_id}
        requestFieldMapping:
          - inPath: tenant_id
            inCustomResource: spec.tenant_id
      - action: delete
        method: DELETE
        path: /os-quota-sets/{tenant_id}
        requestFieldMapping:
          - inPath: tenant_id
            inCustomResource: spec.tenant_id
{{- end }}
