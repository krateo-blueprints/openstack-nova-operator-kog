# Default values for openstack-nova-operator-kog.

# Toggle the per-resource RestDefinitions emitted by this chart.
restdefinitions:
  server:
    enabled: true
    # The Kubernetes API group under which the generated CRD is
    # registered. Generated GVK is `<group>/v1alpha1`.
    resourceGroup: nova.openstack.krateo.io
    # The CRD Kind. It must NOT be "Server": the Nova request body wraps
    # everything in a `{ "server": {...} }` envelope, so the generated
    # spec has a property literally named `server`. crdgen collides a
    # Kind named "Server" with that property and emits an invalid
    # (empty-type) schema node, which the API server rejects.
    resourceKind: Instance
  # Each Nova payload below is also envelope-wrapped (flavor / keypair /
  # server_group / aggregate / quota_set), so each Kind is prefixed to avoid
  # the same crdgen Kind-vs-property collision as `server`->`Instance`.
  flavor:
    enabled: true
    resourceGroup: nova.openstack.krateo.io
    resourceKind: ComputeFlavor
  keypair:
    enabled: true
    resourceGroup: nova.openstack.krateo.io
    resourceKind: ComputeKeypair
  server_group:
    enabled: true
    resourceGroup: nova.openstack.krateo.io
    resourceKind: ComputeServerGroup
  aggregate:
    enabled: true
    resourceGroup: nova.openstack.krateo.io
    resourceKind: ComputeAggregate
  quota:
    # Disabled by default: Nova's PUT /os-quota-sets/{tenant_id} rejects the
    # tenant_id path field leaking into the body (additionalProperties:false).
    # Needs a KOG path-only/excluded-from-body mapping. See assets/quota.yaml.
    enabled: false
    resourceGroup: nova.openstack.krateo.io
    resourceKind: ComputeQuota

# The OpenStack Nova Compute endpoint the generated controllers call
# DIRECTLY. There is no proxy: the OAS declares an `apiKey` scheme, so
# rest-dynamic-controller sets `X-Auth-Token` on the request itself.
#
# Take this from the Keystone service catalog for your project + region:
#   https://compute.gra11.cloud.ovh.net/v2.1/<projectId>   (OVH Public Cloud)
#   http://<nova-api ClusterIP>:8774/v2.1/<projectId>      (in-cluster Nova)
#
# `scripts/get-token.sh --upstream` prints the discovered URL.
nova:
  url: ""

# The Keystone token itself lives in a Secret referenced by each
# <Kind>Configuration CR (spec.authentication.apiKey.tokenRef).
#
# Keystone tokens expire (~1h on OVH), and KEEPING THAT SECRET FRESH IS A
# SECRET-MANAGER'S JOB - not this chart's. Point External Secrets Operator
# (or Vault Agent, or your platform's equivalent) at the Secret and let it
# own minting and rotation. This chart deliberately ships no CronJob, no
# sidecar and no refresh logic: the Secret holds the raw token value only,
# which is exactly what a rotation path can write without knowing anything
# about HTTP framing. See docs/configuration.md.

serviceAccount:
  create: false
  name: ""

nameOverride: ""
fullnameOverride: ""
