# Default values for openstack-nova-operator-kog.

# Toggle the per-resource RestDefinitions emitted by this chart.
restdefinitions:
  server:
    enabled: true
    # The Kubernetes API group under which the generated CRD is
    # registered. Generated GVK is `<group>/v1alpha1`.
    resourceGroup: nova.openstack.krateo.io
    # The CRD Kind. It must NOT be "Server": the Nova request body wraps
    # everything in a `{ "server": {...} }` envelope, so the generated
    # spec has a property literally named `server`. crdgen collides a
    # Kind named "Server" with that property and emits an invalid
    # (empty-type) schema node, which the API server rejects.
    resourceKind: Instance
  # Each Nova payload below is also envelope-wrapped (flavor / keypair /
  # server_group / aggregate / quota_set), so each Kind is prefixed to avoid
  # the same crdgen Kind-vs-property collision as `server`->`Instance`.
  flavor:
    enabled: true
    resourceGroup: nova.openstack.krateo.io
    resourceKind: ComputeFlavor
  keypair:
    enabled: true
    resourceGroup: nova.openstack.krateo.io
    resourceKind: ComputeKeypair
  server_group:
    enabled: true
    resourceGroup: nova.openstack.krateo.io
    resourceKind: ComputeServerGroup
  aggregate:
    enabled: true
    resourceGroup: nova.openstack.krateo.io
    resourceKind: ComputeAggregate
  volume_attachment:
    # SHIPPED DISABLED, AND THAT IS NOW A DECISION RATHER THAN A GAP. The dotted
    # mapping this was gated on is MEASURED -- run 44880829168, oasgen 0.74.0, on
    # a real cluster against a request-logging stand-in:
    #
    #   spec properties   ['configurationRef', 'server_id', 'volumeAttachment']
    #   volumeAttachment  ['device', 'volumeId']     <- survived #419's suppression
    #   on the wire       GET /v2.1/p/servers/srv-probe-1/os-volume_attachments/vol-probe-1
    #                     1 request carrying the real ids, 0 literal templates
    #
    # So `spec.volumeAttachment.volumeId` is not suppressed and `{volume_id}`
    # substitutes. Both conditions this entry used to name are met, and
    # hack/probe-volume-attachment-mapping.sh re-runs the reading at any version.
    #
    # WHAT THAT PASS IS NOT. The stand-in answers 200 unconditionally, so no real
    # Cinder volume was ever attached: the MAPPING is measured, the kind is not
    # exercised. Live verification against a real Nova is parked by decision, so
    # enabling this would ship a kind whose happy path no one here has seen work
    # end to end. That is the reason it stays off, and it is a judgement about
    # evidence rather than a missing measurement.
    #
    # TO ENABLE: set this true. Nothing else is pending -- the two gating
    # readings are done, and the arm can be re-dispatched to confirm them on
    # whatever provider version you are moving to.
    #
    # WHY IT IS WORTH HAVING AT ALL: this is the only kind in this chart that
    # cannot orphan its external resource. Both path parameters come from spec,
    # so nothing it needs comes back from the vendor and there is no
    # created-but-unaddressable state for it to reach.
    enabled: false
    resourceGroup: nova.openstack.krateo.io
    resourceKind: ComputeVolumeAttachment
  quota:
    # ENABLED as of the 0.52.0 pin. It shipped `false` from the day it was
    # written because Nova's PUT /os-quota-sets/{tenant_id} sets
    # additionalProperties:false and rejected the tenant_id that KOG put in the
    # body. oasgen-provider#421 (first released in 0.52.0) fixed the generator
    # bug that forced tenant_id into the body schema in the first place; see
    # assets/quota.yaml and templates/rd-quota.yaml.
    #
    # ComputeQuota writes are Nova ADMIN-ONLY (`rule:context_is_admin`), so on
    # a public cloud with a project-scoped credential these will 403. That is a
    # Nova policy, not a chart defect -- set this back to false if the 403s are
    # noise for your deployment.
    enabled: true
    resourceGroup: nova.openstack.krateo.io
    resourceKind: ComputeQuota

# The OpenStack Nova Compute endpoint the generated controllers call
# DIRECTLY. There is no proxy: the OAS declares an `apiKey` scheme, so
# rest-dynamic-controller sets `X-Auth-Token` on the request itself.
#
# Take this from the Keystone service catalog for your project + region:
#   https://compute.gra11.cloud.ovh.net/v2.1/<projectId>   (OVH Public Cloud)
#   http://<nova-api ClusterIP>:8774/v2.1/<projectId>      (in-cluster Nova)
#
# `scripts/get-token.sh --upstream` prints the discovered URL.
nova:
  url: ""

# The Keystone token itself lives in a Secret referenced by each
# <Kind>Configuration CR (spec.authentication.apiKey.tokenRef).
#
# Keystone tokens expire (~1h on OVH), and KEEPING THAT SECRET FRESH IS A
# SECRET-MANAGER'S JOB - not this chart's. Point External Secrets Operator
# (or Vault Agent, or your platform's equivalent) at the Secret and let it
# own minting and rotation. This chart deliberately ships no CronJob, no
# sidecar and no refresh logic: the Secret holds the raw token value only,
# which is exactly what a rotation path can write without knowing anything
# about HTTP framing. See docs/configuration.md.

# NO `serviceAccount` KNOB, deliberately. This chart deploys no workload of its
# own: it emits ConfigMaps and RestDefinitions, and oasgen-provider deploys the
# one rest-dynamic-controller per RestDefinition under ITS OWN ServiceAccount.
# A `serviceAccount.create` here shipped for months reading like a supported
# setting while no template referenced it -- measured 0 references against
# restdefinitions 24, nameOverride 2, fullnameOverride 2, nova 1 as controls.
# Set the controllers' ServiceAccount on the oasgen-provider chart instead.

nameOverride: ""
fullnameOverride: ""
