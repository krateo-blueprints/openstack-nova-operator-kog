apiVersion: v2
name: openstack-nova-operator-kog
description: |
  Krateo Operator Generator (KOG) packaging that turns OpenStack Nova
  compute instances into native Kubernetes custom resources, validated
  against OVH Public Cloud as the managed OpenStack target.
type: application
version: CHART_VERSION
# appVersion MIRRORS version, and is the SAME placeholder, stamped by the same
# release-time substitution. This chart ships no image of its own -- the
# controller is spawned by oasgen-provider -- so there is no separate application
# version to report, and a hand-maintained one silently drifts: every krateo
# blueprint chart still declares appVersion 2025.1 while its images are 2026.1
# (their #235), and krateo-blueprints/charts found one declaring 0.1.9 in a
# repository that had released 0.15.0. REPOSITORY.md R4 (charts 1.5.1).
#
# THE STAMPER SUBSTITUTES CHART_VERSION GLOBALLY: the shared release-oci.yaml's
# (line 336, `sed -i "s/CHART_VERSION/${VERSION}/g"`), which is now the only one
# that touches this file -- release-tag.yaml's own loops are retired with it --
# so this line is stamped wherever the release runs. A substitution ANCHORED to `version: CHART_VERSION` stamps
# only the line above and leaves the literal placeholder here. helm accepts any
# string in appVersion, so that publishes with no error and no warning; two
# probes staged charts that way until this commit. validate.py screens the form.
appVersion: CHART_VERSION
keywords:
  - krateo
  - kog
  - oasgen-provider
  - openstack
  - nova
  - ovh
  - operator
  - compute
home: https://github.com/krateo-blueprints/openstack-nova-operator-kog
sources:
  - https://github.com/krateo-blueprints/openstack-nova-operator-kog
maintainers:
  - name: krateo
# The icon is published into the helm index and rendered on the portal Marketplace card.
# IT MUST BE A URL THE ORG CONTROLS. The previous value was the OpenStack Nova mascot on
# www.openstack.org, which now returns 404 -- measured three ways (plain, browser UA, -L),
# with openstack.org's own root returning 200 as the control, so the site moved the file.
# Nothing caught it: a dead third-party URL is still a syntactically valid https icon, and
# the chart had never been published since, so no card had ever rendered it.
# This is the org standard: 1247 entries in the live blueprints index use this exact path.
# Do NOT use raw.githubusercontent.com/krateoplatformops/... (no hyphen) -- 385 index entries
# still do, and it resolves 200 through GitHub's org-rename redirect, so it fails silently.
icon: https://raw.githubusercontent.com/krateo-platformops/.github/main/brand/logo.svg
annotations:
  # org standard R3: a chart that ships its CompositionDefinition inside chart/ is not required to be named after
  # the repository, but this annotation must equal https://github.com/krateo-blueprints/<live repository name>.
  # Change it, `home` and `sources` together when the repository is renamed.
  krateo.io/source-repo: https://github.com/krateo-blueprints/openstack-nova-operator-kog
  krateo.io/category: compute
  krateo.io/display-name: OpenStack Nova KOG
  krateo.io/maturity: beta
  krateoSupportedVersion: ">= 2.5.1"
